<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <script src="/js/tema-horario.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#060605">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>Reportes - COGUSA SGI</title>
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="tema-reportes">
<div id="app">
  <header class="barra-superior">
    <div class="marca">
      <img src="assets/logo-g.png" alt="Empresas Galindo" class="marca-icono">
      <div class="marca-texto">
        <h1>Reportes</h1>
        <div class="subt" id="nombre-inspector"></div>
      </div>
    </div>
    <nav data-nav-principal></nav>
  </header>

  <main class="contenedor">
    <div style="display:flex; justify-content:flex-end; margin-bottom:14px;">
      <a href="inspector.html" class="btn btn-primario" data-modulo="nuevo-reporte" style="display:none; text-decoration:none;">
        <svg class="icono icono-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuevo reporte
      </a>
    </div>

    <div class="tarjeta filtros-reportes">
      <div class="fila-campos">
        <div class="campo" style="flex:2; min-width:220px;">
          <label for="filtro-texto">Buscar por zona o descripción</label>
          <input type="text" id="filtro-texto" placeholder="Ej: Ward 13, olor a descomposición...">
        </div>
        <div class="campo">
          <label for="filtro-proceso">Proceso</label>
          <select id="filtro-proceso"></select>
        </div>
        <div class="campo">
          <label for="filtro-categoria">Categoría</label>
          <select id="filtro-categoria"></select>
        </div>
      </div>
      <button type="button" class="btn btn-secundario btn-pequeno" id="btn-limpiar-filtros-reportes">Limpiar filtros</button>
      <p class="ayuda" id="contador-filtros-reportes" style="margin-top:8px;"></p>
    </div>

    <div id="lista-reportes" class="rejilla-reportes"></div>
    <div style="display:flex; justify-content:center; margin-top:16px;">
      <button type="button" class="btn btn-secundario" id="btn-cargar-mas-reportes" style="display:none;">Cargar 5 más</button>
    </div>
  </main>
</div>

<div class="modal-fondo" id="modal-reporte-inspector" style="display:none;">
  <div class="modal-caja">
    <div class="modal-encabezado">
      <h2 id="titulo-modal-reporte-inspector">Reporte</h2>
      <button class="cerrar-modal" id="cerrar-modal-reporte-inspector" aria-label="Cerrar">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-cuerpo" id="cuerpo-modal-reporte-inspector"></div>
    <div class="modal-pie">
      <button class="btn btn-primario" id="btn-guardar-estado-hallazgo">Guardar estado</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/auth.js"></script>
<script src="js/reportes.js"></script>
<script>
let usuarioActual = null;
let reporteModalActualId = null;
let modalAutoAbiertoDesdeHash = false;
let reportesCacheActual = [];

// La lista ya no escucha en vivo TODOS los reportes del usuario (podía crecer
// sin límite con el tiempo): se pagina de 5 en 5, del más reciente al más
// antiguo, con un botón "Cargar 5 más" para traer los siguientes.
const REPORTES_PROPIOS_POR_PAGINA = 5;
let ultimoDocReportesPropios = null;
let hayMasReportesPropios = true;
let cargandoPaginaReportesPropios = false;
// Lista completa de respaldo, solo si la consulta ordenada no se puede usar
// en esta base (ver traerPaginaOrdenada).
let respaldoReportesPropios = null;

// Se permite cualquier rol (null): tanto inspectores como el admin pueden
// ver la lista de sus propios reportes.
protegerPagina(null, async (user, perfil, permisos) => {
  usuarioActual = user;
  document.getElementById("nombre-inspector").textContent = perfil.nombre || perfil.correo;
  montarNavPrincipal(perfil, permisos);
  inicializarCampana(perfil, user.uid);
  await inicializarFiltrosReportes();

  await cargarPaginaReportesPropios();
});

async function cargarPaginaReportesPropios() {
  if (cargandoPaginaReportesPropios || !hayMasReportesPropios) return;
  cargandoPaginaReportesPropios = true;
  actualizarBotonCargarMasReportes();
  try {
    if (!respaldoReportesPropios && !(await traerPaginaOrdenada())) {
      await prepararRespaldoReportesPropios();
    }
    if (respaldoReportesPropios) tomarPaginaDelRespaldo();
    aplicarFiltrosReportes();

    // Si se llegó con reportes.html#reporte-<id> (ej. enlace directo desde la
    // campana de notificaciones), abrir directamente ese reporte. Si aún no
    // está entre los cargados, se sigue paginando hasta encontrarlo.
    if (!modalAutoAbiertoDesdeHash && location.hash.startsWith("#reporte-")) {
      const id = location.hash.slice("#reporte-".length);
      const reporte = reportesCacheActual.find((r) => r.id === id);
      if (reporte) {
        modalAutoAbiertoDesdeHash = true;
        abrirModalReporte(reporte);
      } else if (hayMasReportesPropios) {
        cargarPaginaReportesPropios();
      }
    }
  } catch (err) {
    console.error("Error cargando reportes:", err);
    document.getElementById("lista-reportes").innerHTML =
      `<p class="aviso aviso-error">No se pudo cargar sus reportes. Verifique su conexión.</p>`;
  } finally {
    cargandoPaginaReportesPropios = false;
    actualizarBotonCargarMasReportes();
  }
}

/**
 * Trae la siguiente página ordenada por "creadoEn" (lo barato: Firestore
 * ordena y corta). Devuelve false si esa vía no sirve en esta base, sin
 * romper la pantalla, para que el llamador use el respaldo.
 */
async function traerPaginaOrdenada() {
  let snap;
  try {
    let consulta = colReportes.where("inspectorUid", "==", usuarioActual.uid)
      .orderBy("creadoEn", "desc").limit(REPORTES_PROPIOS_POR_PAGINA);
    if (ultimoDocReportesPropios) consulta = consulta.startAfter(ultimoDocReportesPropios);
    snap = await consulta.get();
  } catch (err) {
    // Ordenar por un campo distinto al del filtro exige un índice compuesto
    // (inspectorUid + creadoEn). Si no está creado en la base, Firestore
    // rechaza la consulta e incluye en el error el enlace para crearlo.
    console.warn("No se pudo ordenar por creadoEn; se listan sin ordenar en la página.", err);
    return false;
  }

  // Primera página vacía: puede ser que de verdad no haya reportes, o que los
  // que hay se hayan creado antes de que existiera el campo "creadoEn"
  // —Firestore excluye del orden a los documentos que no lo tienen—. Se
  // comprueba con una consulta simple antes de darlos por inexistentes.
  if (!snap.docs.length && !ultimoDocReportesPropios) {
    const prueba = await colReportes.where("inspectorUid", "==", usuarioActual.uid).limit(1).get();
    if (prueba.docs.length) {
      console.warn('Hay reportes sin "creadoEn": el orden por ese campo los dejaba fuera.');
      return false;
    }
  }

  reportesCacheActual = reportesCacheActual.concat(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
  ultimoDocReportesPropios = snap.docs.length ? snap.docs[snap.docs.length - 1] : ultimoDocReportesPropios;
  hayMasReportesPropios = snap.docs.length === REPORTES_PROPIOS_POR_PAGINA;
  return true;
}

/**
 * Respaldo: una sola consulta simple con los reportes propios (sin orden, así
 * que no necesita índice y no deja fuera a los que no tienen "creadoEn"). Se
 * ordenan aquí y se siguen entregando de 5 en 5.
 */
async function prepararRespaldoReportesPropios() {
  const snap = await colReportes.where("inspectorUid", "==", usuarioActual.uid).get();
  respaldoReportesPropios = snap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => milisegundosDeReporte(b) - milisegundosDeReporte(a));
}

function milisegundosDeReporte(r) {
  const marca = r.creadoEn || r.fechaHora;
  if (!marca) return 0;
  const fecha = marca.toDate ? marca.toDate() : new Date(marca);
  return isNaN(fecha) ? 0 : fecha.getTime();
}

function tomarPaginaDelRespaldo() {
  const desde = reportesCacheActual.length;
  reportesCacheActual = reportesCacheActual.concat(
    respaldoReportesPropios.slice(desde, desde + REPORTES_PROPIOS_POR_PAGINA)
  );
  hayMasReportesPropios = reportesCacheActual.length < respaldoReportesPropios.length;
}

function actualizarBotonCargarMasReportes() {
  const btn = document.getElementById("btn-cargar-mas-reportes");
  if (!hayMasReportesPropios) { btn.style.display = "none"; return; }
  btn.style.display = "inline-flex";
  btn.disabled = cargandoPaginaReportesPropios;
  btn.textContent = cargandoPaginaReportesPropios ? "Cargando..." : "Cargar 5 más";
}
document.getElementById("btn-cargar-mas-reportes").addEventListener("click", cargarPaginaReportesPropios);

// --- FILTROS: por zona/descripción (texto libre), proceso y categoría -----
async function inicializarFiltrosReportes() {
  const selProceso = document.getElementById("filtro-proceso");
  const selCategoria = document.getElementById("filtro-categoria");
  await Promise.all([poblarSelectProcesos(selProceso), poblarSelectCategorias(selCategoria)]);
  selProceso.options[0].textContent = "Todos los procesos";
  selCategoria.options[0].textContent = "Todas las categorías";

  document.getElementById("filtro-texto").addEventListener("input", aplicarFiltrosReportes);
  selProceso.addEventListener("change", aplicarFiltrosReportes);
  selCategoria.addEventListener("change", aplicarFiltrosReportes);
  document.getElementById("btn-limpiar-filtros-reportes").addEventListener("click", () => {
    document.getElementById("filtro-texto").value = "";
    selProceso.value = "";
    selCategoria.value = "";
    aplicarFiltrosReportes();
  });
}

function aplicarFiltrosReportes() {
  const texto = normalizarClave(document.getElementById("filtro-texto").value);
  const proceso = document.getElementById("filtro-proceso").value;
  const categoria = document.getElementById("filtro-categoria").value;

  const filtrados = reportesCacheActual.filter((r) => {
    if (proceso && r.proceso !== proceso) return false;
    if (categoria && r.categoria !== categoria) return false;
    if (texto) {
      const coincideZona = normalizarClave(r.zona).includes(texto);
      const coincideDescripcion = normalizarClave(r.descripcion).includes(texto);
      if (!coincideZona && !coincideDescripcion) return false;
    }
    return true;
  });

  const hayFiltrosActivos = texto || proceso || categoria;
  document.getElementById("contador-filtros-reportes").textContent = hayFiltrosActivos
    ? `Mostrando ${filtrados.length} de ${reportesCacheActual.length} reportes.`
    : "";

  renderizarListaReportes(filtrados, abrirModalReporte,
    hayFiltrosActivos ? "Ningún reporte coincide con los filtros aplicados." : "Todavía no tiene reportes registrados.");
}

function abrirModalReporte(reporte) {
  reporteModalActualId = reporte.id;
  const estadoActual = reporte.estadoHallazgo || "abierto";
  document.getElementById("titulo-modal-reporte-inspector").textContent = `${reporte.zona} — ${reporte.proceso}`;
  document.getElementById("cuerpo-modal-reporte-inspector").innerHTML = `
    <div class="fotos-grid" style="grid-template-columns:repeat(${(reporte.fotos || []).length || 1},1fr); margin-bottom:14px;">
      ${(reporte.fotos || []).map((f) => `<div class="foto-miniatura"><img src="${f}"></div>`).join("")}
    </div>
    <p><strong>Fecha:</strong> ${formatearFechaHora(reporte.fechaHora)}${reporte.turno ? " · " + reporte.turno : ""}${correccionInline(reporte, "Turno")}</p>
    <p><strong>Zona:</strong> ${reporte.zona}${correccionInline(reporte, "Zona")}</p>
    <p><strong>Proceso:</strong> ${reporte.proceso}${correccionInline(reporte, "Proceso")}</p>
    <p><strong>Descripción:</strong> ${reporte.descripcion}</p>
    <p><strong>Categoría:</strong> ${textoCategoria(reporte)}${correccionInline(reporte, "Categoría")}</p>
    <p><strong>Validación del coordinador:</strong> ${reporte.estado === "validado" ? "Ya revisado" : "Pendiente de revisar"}</p>
    ${reporte.gravedad ? `<p><strong>Gravedad:</strong> <span class="etiqueta-gravedad ${claseGravedad(reporte.gravedad)}">${reporte.gravedad}</span></p>` : ""}
    ${reporte.ultimoCambioAdmin?.ubicacionCorregida ? `<p class="aviso aviso-advertencia">El coordinador también corrigió la ubicación (GPS/plano).</p>` : ""}
    ${reporte.ultimoCambioAdmin?.mensaje ? `<p class="aviso aviso-info"><strong>Comentario del coordinador:</strong> ${reporte.ultimoCambioAdmin.mensaje}</p>` : ""}
    <div class="campo">
      <label for="sel-estado-hallazgo">Estado del hallazgo (seguimiento propio)</label>
      <select id="sel-estado-hallazgo">
        <option value="abierto" ${estadoActual === "abierto" ? "selected" : ""}>Abierto</option>
        <option value="en_proceso" ${estadoActual === "en_proceso" ? "selected" : ""}>En proceso</option>
        <option value="corregido" ${estadoActual === "corregido" ? "selected" : ""}>Corregido</option>
      </select>
    </div>
  `;
  document.getElementById("modal-reporte-inspector").style.display = "flex";

  // Si llegó con un aviso pendiente (cambioSinVer), al ver el detalle
  // se da por visto.
  if (reporte.cambioSinVer) {
    colReportes.doc(reporte.id).update({ cambioSinVer: false }).catch(() => {});
  }
}

document.getElementById("cerrar-modal-reporte-inspector").addEventListener("click", () => {
  document.getElementById("modal-reporte-inspector").style.display = "none";
});
document.getElementById("modal-reporte-inspector").addEventListener("click", (e) => {
  if (e.target.id === "modal-reporte-inspector") e.target.style.display = "none";
});
document.getElementById("btn-guardar-estado-hallazgo").addEventListener("click", async () => {
  const valor = document.getElementById("sel-estado-hallazgo").value;
  try {
    await colReportes.doc(reporteModalActualId).update({ estadoHallazgo: valor });
    mostrarAvisoGlobal("Estado del hallazgo actualizado.", "exito");
    document.getElementById("modal-reporte-inspector").style.display = "none";
  } catch (err) {
    console.error(err);
    mostrarAvisoGlobal("No se pudo guardar el estado. Intente de nuevo.", "error");
  }
});
</script>
</body>
</html>
