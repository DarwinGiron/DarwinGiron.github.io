/* ---------- utilidades de fecha ---------- */
const $root = document.getElementById("root");
const pad = n => (n < 10 ? "0" : "") + n;
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const longDate = s => cap(parse(s).toLocaleDateString("es-GT", { weekday: "long", day: "numeric", month: "long" }));
const shortDate = s => { const p = s.split("-"); return p[2] + "/" + p[1]; };
const mondayOf = s => { const d = parse(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ymd(d); };
const DOW = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const DOW1 = ["D", "L", "M", "M", "J", "V", "S"];
const toast = (msg, tipo = "info") => mostrarToast(msg, tipo);

/* Motor de repetición: está en motor.js (se carga arriba como window.Motor) */
const { occursOn } = window.Motor;

/* Una sola forma de describir la repetición, corta, en todas las pantallas. */
function describeRule(s) {
  const r = s.rule || { type: "once" };
  switch (r.type) {
    case "once": return "Una vez";
    case "daily": return "Todos los días";
    case "weekdays": return "Lunes a viernes";
    case "weekly": {
      const d = (r.days || []).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
      if (d.length === 7) return "Todos los días";
      if (d.length === 5 && d.join() === "1,2,3,4,5") return "Lunes a viernes";
      const n = d.map(i => DOW[i].slice(0, 3).toLowerCase());
      return cap(n.length > 1 ? n.slice(0, -1).join(", ") + " y " + n[n.length - 1] : n[0] || "Semanal");
    }
    case "monthly": return r.lastBusinessDay ? "Último día hábil del mes" : "Día " + r.dayOfMonth + " de cada mes";
    case "months": return "Cada " + r.interval + " meses";
    case "yearly": return "Cada año";
  }
  return "";
}

/* ---------- estado ---------- */
const S = {
  me: null, users: {}, series: {}, occ: {},
  view: "hoy", date: today(), cal: today().slice(0, 7), filter: "all",
  atrasadasAbiertas: false, gruposAbiertos: new Set(), detalle: null
};
let auth, db, app, unsubs = [];
const isAdmin = () => S.me && S.me.role === "admin";

/* ---------- DOM ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c !== null && c !== undefined && c !== false) el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return el;
}

/* Ventana del hub (modal-fondo + modal-caja): hoja abajo en el celular,
   centrada en pantallas grandes. Escape o tocar fuera la cierran. */
function sheet(title, build, onClose, { enfocar = true } = {}) {
  const ov = h("div", { class: "modal-fondo" });
  const box = h("div", { class: "modal-caja", role: "dialog", "aria-modal": "true", "aria-label": title });
  const close = () => { ov.remove(); document.removeEventListener("keydown", esc); if (onClose) onClose(); };
  // Escape cierra solo la ventana de más arriba (puede haber una encima de otra).
  const esc = e => { if (e.key === "Escape" && [...document.querySelectorAll(".modal-fondo")].pop() === ov) close(); };
  ov.addEventListener("click", e => { if (e.target === ov) close(); });
  document.addEventListener("keydown", esc);
  box.appendChild(h("div", { class: "modal-caja__cabecera" },
    h("h3", { style: "margin:0" }, title),
    h("button", { class: "btn btn-icono btn-fantasma", type: "button", "aria-label": "Cerrar", onclick: close }, "✕")));
  ov.appendChild(box); document.body.appendChild(ov);
  build(box, close);
  // En formularios se enfoca el primer campo; en el detalle no (abriría el teclado del celular sin pedirlo).
  if (enfocar) { const f = box.querySelector("input:not([type=file]),select,textarea"); if (f) setTimeout(() => f.focus(), 30); }
  else setTimeout(() => box.querySelector(".modal-caja__cabecera button").focus(), 30);
  return close;
}
const campo = (label, input, id, ayuda) => h("div", { class: "campo" }, h("label", { for: id }, label), input, ayuda ? h("p", { class: "campo-ayuda" }, ayuda) : null);

/* ---------- datos derivados ---------- */
function visibleSeries() {
  return Object.values(S.series).filter(s => s.active !== false && (!isAdmin() || S.filter === "all" || s.assigneeUid === S.filter));
}
const occKey = (sid, date) => sid + "_" + date;
function itemsFor(date) {
  const out = [];
  visibleSeries().forEach(s => {
    if (!occursOn(s, date)) return;
    const o = S.occ[occKey(s.id, date)];
    if (o && o.skipped) return;
    out.push({ s, date, key: occKey(s.id, date), occ: o || null });
  });
  out.sort((a, b) => {
    const ad = !!(a.occ && a.occ.done), bd = !!(b.occ && b.occ.done);
    return ad === bd ? (a.occ && a.occ.titleOverride || a.s.title).localeCompare(b.occ && b.occ.titleOverride || b.s.title) : ad ? 1 : -1;
  });
  return out;
}
const DIAS_ATRASO = 45;
function carriedItems() {
  const t = today(), out = [];
  for (let i = 1; i <= DIAS_ATRASO; i++) {
    const d = addDays(t, -i);
    itemsFor(d).forEach(it => { if (!(it.occ && (it.occ.done || it.occ.closed))) out.push(it); });
  }
  return out;
}
/* Las atrasadas se agrupan por tarea: "Limpieza de filtros · 30 días", no 30 tarjetas. */
function gruposAtrasadas() {
  const g = new Map();
  carriedItems().forEach(it => {
    if (!g.has(it.s.id)) g.set(it.s.id, { s: it.s, items: [] });
    g.get(it.s.id).items.push(it);
  });
  return [...g.values()].map(x => (x.items.sort((a, b) => (a.date < b.date ? 1 : -1)), x)).sort((a, b) => b.items.length - a.items.length);
}
function estadoDe(it) {
  const o = it.occ || {};
  if (o.done) return o.doneOn && o.doneOn > it.date ? { t: "Hecha con retraso (" + shortDate(o.doneOn) + ")", c: "badge-alerta" } : { t: "Hecha", c: "badge-exito" };
  if (it.date < today()) return { t: "No cumplida", c: "badge-critico" };
  return { t: "Pendiente", c: "badge-neutro" };
}
const nameOf = uid => (S.users[uid] && S.users[uid].name) || (S.me && uid === S.me.uid ? S.me.name : "Sin nombre");
const canEditSeries = s => isAdmin() || s.createdBy === S.me.uid;
const tituloDe = it => (it.occ && it.occ.titleOverride) || it.s.title;

/* ---------- escritura ---------- */
async function saveOcc(it, patch) {
  try {
    await setDoc(doc(db, "occ", it.key), Object.assign(
      { seriesId: it.s.id, date: it.date, assigneeUid: it.s.assigneeUid },
      patch, { updatedAt: serverTimestamp() }), { merge: true });
    return true;
  } catch (e) { toast("No se pudo guardar. Revisa tu conexión.", "error"); console.error(e); return false; }
}
function marcar(it, hecha) {
  return saveOcc(it, { done: hecha, doneOn: hecha ? today() : "" });
}
/* Descarta de una vez todas las atrasadas de una tarea (quedan como No cumplidas en su día). */
async function descartarGrupo(items) {
  try {
    const lote = writeBatch(db);
    items.forEach(it => lote.set(doc(db, "occ", it.key), { seriesId: it.s.id, date: it.date, assigneeUid: it.s.assigneeUid, closed: true, updatedAt: serverTimestamp() }, { merge: true }));
    await lote.commit();
    toast(items.length === 1 ? "Se quitó de atrasadas." : items.length + " días quitados de atrasadas.", "exito");
  } catch (e) { console.error(e); toast("No se pudo quitar. Revisa tu conexión.", "error"); }
}

/* ---------- evidencia ---------- */
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function compressImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let max = 1280, q = 0.72, out;
      for (let i = 0; i < 6; i++) {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 600000) break;
        max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.05);
      }
      URL.revokeObjectURL(url); out.length < 900000 ? res(out) : rej(new Error("grande"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("imagen")); };
    img.src = url;
  });
}
async function attach(it, files) {
  const added = [];
  toast("Adjuntando…");
  for (const f of files) {
    try {
      let data, type = f.type || "application/octet-stream";
      if (type.indexOf("image/") === 0) { data = await compressImage(f); type = "image/jpeg"; }
      else {
        if (f.size > 500 * 1024) { toast("«" + f.name + "» pesa más de 500 KB. Reduce el archivo o usa una foto.", "alerta"); continue; }
        data = await readAsDataURL(f);
      }
      const id = (Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
      // la ocurrencia debe existir antes que su evidencia
      await setDoc(doc(db, "occ", it.key), { seriesId: it.s.id, date: it.date, assigneeUid: it.s.assigneeUid, updatedAt: serverTimestamp() }, { merge: true });
      await setDoc(doc(db, "occ", it.key, "files", id), { assigneeUid: it.s.assigneeUid, name: f.name, type, data, createdAt: serverTimestamp() });
      added.push({ id, name: f.name, type });
    } catch (e) { toast("No se pudo adjuntar «" + f.name + "».", "error"); console.error(e); }
  }
  // arrayUnion agrega sin reescribir la lista: si otro celular adjuntó algo al
  // mismo tiempo, no se pierde.
  if (added.length) { await saveOcc(it, { evidence: arrayUnion(...added) }); toast("Evidencia adjuntada", "exito"); }
}
async function openEvidence(it, ev) {
  try {
    const snap = await getDoc(doc(db, "occ", it.key, "files", ev.id));
    if (!snap.exists()) { toast("No se encontró el archivo.", "error"); return; }
    const d = snap.data();
    // seguridad: solo se muestran archivos guardados como data: (nunca otra clase de enlace)
    if (typeof d.data !== "string" || d.data.indexOf("data:") !== 0) { toast("El archivo no es válido.", "error"); return; }
    sheet(ev.name, (box) => {
      const v = h("div", { class: "visor" });
      if (d.type.indexOf("image/") === 0) v.appendChild(h("img", { src: d.data, alt: ev.name }));
      v.appendChild(h("a", { class: "btn btn-dorado", href: d.data, download: ev.name, style: "text-decoration:none" }, "Descargar"));
      box.appendChild(v);
    });
  } catch (e) { toast("No se pudo abrir el archivo.", "error"); }
}
async function removeEvidence(it, ev) {
  try { await deleteDoc(doc(db, "occ", it.key, "files", ev.id)); } catch (e) {}
  // Se quita la entrada exacta guardada (mismo objeto { id, name, type }).
  const guardada = ((it.occ && it.occ.evidence) || []).find(x => x.id === ev.id) || ev;
  await saveOcc(it, { evidence: arrayRemove(guardada) });
}

/* ---------- fila de tarea (lista) ---------- */
function filaTarea(it) {
  const o = it.occ || {}, done = !!o.done, title = tituloDe(it);
  const marcaBtn = h("button", { class: "marca", type: "button", role: "checkbox", "aria-checked": done ? "true" : "false", "aria-label": (done ? "Desmarcar: " : "Marcar como hecha: ") + title });
  marcaBtn.addEventListener("click", async () => {
    marcaBtn.setAttribute("aria-checked", done ? "false" : "true");
    if (await marcar(it, !done)) toast(done ? "Marcada como pendiente." : "¡Hecha!", done ? "info" : "exito");
  });
  const meta = [];
  const st = estadoDe(it);
  if (!done && it.date < today()) meta.push(h("span", { class: "badge badge-critico" }, "No cumplida"));
  if (done && o.doneOn && o.doneOn > it.date) meta.push(h("span", { class: "badge badge-alerta" }, "Con retraso"));
  const partes = [describeRule(it.s)];
  if (isAdmin()) partes.push(nameOf(it.s.assigneeUid));
  if (o.note) partes.push("💬 comentario");
  if ((o.evidence || []).length) partes.push("📎 " + o.evidence.length);
  meta.push(h("span", null, partes.join(" · ")));
  const cuerpo = h("button", { class: "fila-tarea__cuerpo", type: "button", "aria-label": "Abrir " + title + " (" + st.t + ")", onclick: () => abrirTarea(it) },
    h("span", { class: "fila-tarea__textos" }, h("span", { class: "fila-tarea__titulo" }, title), h("span", { class: "fila-tarea__meta" }, meta)),
    h("span", { class: "fila-tarea__chevron", "aria-hidden": "true" }, "›"));
  return h("li", { class: "fila-tarea" + (done ? " hecha" : "") }, marcaBtn, cuerpo);
}

/* ---------- detalle de una tarea (ventana) ---------- */
function abrirTarea(it, carried) {
  const s = it.s, rep = (s.rule || {}).type !== "once";
  const actual = () => Object.assign({}, it, { occ: S.occ[it.key] || it.occ || null });
  const close = sheet(tituloDe(it), (box, cerrar) => {
    box.appendChild(h("p", { class: "detalle-meta" }, longDate(it.date) + " · " + describeRule(s) + (isAdmin() ? " · " + nameOf(s.assigneeUid) : "")));
    if (s.notes) box.appendChild(h("p", { class: "texto-sm", style: "margin:0 0 16px" }, s.notes));

    const zonaEstado = h("div");
    const pintarEstado = () => {
      const cur = actual(), done = !!(cur.occ && cur.occ.done), st = estadoDe(cur);
      zonaEstado.innerHTML = "";
      zonaEstado.appendChild(h("div", { class: "flex-entre", style: "margin-bottom:16px" }, h("span", { class: "badge " + st.c }, st.t)));
      zonaEstado.appendChild(done
        ? h("button", { class: "btn btn-secundario", type: "button", onclick: async () => { await marcar(cur, false); } }, "Desmarcar (volver a pendiente)")
        : h("button", { class: "btn btn-primario", type: "button", onclick: async () => { if (await marcar(cur, true)) { toast("¡Hecha!", "exito"); cerrar(); } } }, "✓ Marcar como hecha"));
    };
    box.appendChild(zonaEstado);

    const nota = h("textarea", { id: "d-nota", maxlength: "300", rows: "3", placeholder: "Opcional: qué se hizo, novedades…" });
    nota.value = (it.occ && it.occ.note) || "";
    nota.addEventListener("change", () => saveOcc(actual(), { note: nota.value.trim() }).then(okk => okk && toast("Comentario guardado", "exito")));
    box.appendChild(h("div", { style: "margin-top:20px" }, campo("Comentario", nota, "d-nota")));

    const evid = h("div", { class: "evidencias" });
    const pintarEvidencias = () => {
      const cur = actual();
      evid.innerHTML = "";
      ((cur.occ && cur.occ.evidence) || []).forEach(e => evid.appendChild(h("span", { class: "evidencia" },
        h("button", { type: "button", onclick: () => openEvidence(cur, e), title: e.name }, "📎 " + e.name),
        h("button", { type: "button", class: "quitar", "aria-label": "Quitar " + e.name, onclick: () => { if (confirm("¿Quitar «" + e.name + "»?")) removeEvidence(cur, e); } }, "✕"))));
      const fi = h("input", { type: "file", multiple: true, accept: "image/*,.pdf,.doc,.docx,.xls,.xlsx", "aria-label": "Adjuntar foto o archivo" });
      fi.addEventListener("change", () => { if (fi.files.length) attach(actual(), Array.from(fi.files)); });
      evid.appendChild(h("label", { class: "btn btn-secundario btn-sm btn-ancho-auto adjuntar" }, "+ Foto o archivo", fi));
    };
    box.appendChild(h("div", { class: "campo" }, h("label", null, "Evidencia (opcional)"), evid));

    const opciones = h("div", { class: "opciones" });
    if (canEditSeries(s)) opciones.appendChild(h("button", { class: "btn btn-fantasma", type: "button", onclick: () => { cerrar(); editFlow(it); } }, "✎  Editar tarea"));
    if (carried) opciones.appendChild(h("button", { class: "btn btn-fantasma", type: "button", onclick: async () => { cerrar(); await descartarGrupo([it]); } }, "Quitar de atrasadas (queda como no cumplida)"));
    if (rep) opciones.appendChild(h("button", { class: "btn btn-fantasma", type: "button", onclick: async () => { cerrar(); if (await saveOcc(it, { skipped: true })) toast("Omitida solo el " + shortDate(it.date), "exito"); } }, "Omitir solo el " + shortDate(it.date)));
    if (canEditSeries(s)) opciones.appendChild(h("button", { class: "btn btn-peligro", type: "button", onclick: () => { cerrar(); deleteFlow(it); } }, "Eliminar tarea…"));
    if (opciones.children.length) box.appendChild(opciones);

    // Si llegan cambios de la base (otro celular, una evidencia nueva) se
    // repinta solo el estado y la evidencia, no el comentario que se escribe.
    S.detalle = { key: it.key, refrescar: () => { pintarEstado(); pintarEvidencias(); } };
    pintarEstado(); pintarEvidencias();
  }, () => { S.detalle = null; }, { enfocar: false });
  return close;
}

/* ---------- menú de edición ---------- */
function deleteFlow(it) {
  const s = it.s, rep = (s.rule || {}).type !== "once";
  sheet("Eliminar tarea", (box, close) => {
    box.appendChild(h("p", { class: "detalle-meta" }, "«" + s.title + "»"));
    const run = async fn => { close(); try { await fn(); toast("Tarea eliminada", "exito"); } catch (e) { toast("No se pudo eliminar.", "error"); } };
    const col = h("div", { class: "opciones", style: "margin-top:0;padding-top:0;border:0" });
    if (!rep) col.appendChild(h("button", { class: "btn btn-peligro", type: "button", onclick: () => run(() => deleteDoc(doc(db, "series", s.id))) }, "Eliminar"));
    else {
      col.appendChild(h("button", { class: "btn btn-secundario", type: "button", onclick: () => run(() => setDoc(doc(db, "occ", it.key), { seriesId: s.id, date: it.date, assigneeUid: s.assigneeUid, skipped: true, updatedAt: serverTimestamp() }, { merge: true })) }, "Solo el " + shortDate(it.date)));
      col.appendChild(h("button", { class: "btn btn-peligro", type: "button", onclick: () => run(() => s.startDate >= it.date ? deleteDoc(doc(db, "series", s.id)) : updateDoc(doc(db, "series", s.id), { endDate: addDays(it.date, -1) })) }, "Desde el " + shortDate(it.date) + " en adelante"));
      col.appendChild(h("p", { class: "texto-sm texto-suave", style: "margin:0" }, "Lo registrado antes del " + shortDate(it.date) + " se conserva."));
    }
    box.appendChild(col);
  });
}
function editFlow(it) {
  const s = it.s, rep = (s.rule || {}).type !== "once";
  if (!rep) return seriesForm(s, it.date, "all");
  sheet("¿Qué quieres cambiar?", (box, close) => {
    const col = h("div", { class: "opciones", style: "margin-top:0;padding-top:0;border:0" });
    col.appendChild(h("button", { class: "btn btn-secundario", type: "button", onclick: () => { close(); onlyOnce(it); } }, "Solo el nombre del " + shortDate(it.date)));
    col.appendChild(h("button", { class: "btn btn-secundario", type: "button", onclick: () => { close(); seriesForm(s, it.date, "following"); } }, "La tarea desde el " + shortDate(it.date) + " en adelante"));
    box.appendChild(col);
  });
}
function onlyOnce(it) {
  sheet("Nombre solo el " + shortDate(it.date), (box, close) => {
    const t = h("input", { id: "oo", type: "text", value: tituloDe(it), maxlength: "120" });
    box.appendChild(campo("Nombre de la tarea", t, "oo"));

/* ---------- estructura principal ---------- */
/* Dibujo diferido: los datos que llegan de Firestore piden redibujar, pero si la persona
   está escribiendo en la pantalla principal se espera a que salga del campo; así no se
   pierde el foco ni el texto. Las acciones del usuario siguen dibujando al instante. */
let renderTimer = null, renderPending = false;
function isTyping() {
  const a = document.activeElement;
  if (!a || !$root.contains(a)) return false;
  return a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && ["checkbox", "radio", "button", "file", "submit"].indexOf(a.type) < 0);
}
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { if (isTyping()) renderPending = true; else { renderPending = false; render(); } }, 60);
}
$root.addEventListener("focusout", () => {
  if (renderPending) setTimeout(() => { if (!isTyping()) { renderPending = false; render(); } }, 0);
});

function render() {

  const act = document.activeElement, inRoot = act && act !== document.body && $root.contains(act);
  const keepId = inRoot && act.id ? act.id : null;
  const keepIdx = inRoot ? Array.prototype.indexOf.call($root.querySelectorAll(FOCUSABLE), act) : -1;
  $root.innerHTML = "";

  const rol = S.me.rolHub ? (ETIQUETA_ROL[S.me.rolHub] || S.me.rolHub) : (isAdmin() ? "Administrador" : "Miembro");
  const primerNombre = String(S.me.name || "").split(" ")[0] || "";
  const header = h("header", { class: "app-header" },
    h("div", { class: "app-header__marca" },
      h("a", { href: "/hub/", class: "app-header__logo", title: "Volver al hub", "aria-label": "Volver al hub" }, "✓"),
      h("div", { class: "app-header__titulos" }, h("div", { class: "titulo" }, "Hola" + (primerNombre ? ", " + primerNombre : "")), h("div", { class: "subtitulo" }, "Control de tareas · " + rol))),
    h("div", { class: "app-header__acciones" },
      h("span", { class: "avatar avatar--claro avatar--sm", "aria-hidden": "true" }, iniciales(S.me.name || S.me.email || "?")),
      h("button", { class: "btn btn-texto btn-sm", type: "button", title: "Cierra la sesión aquí y en el hub", onclick: () => signOut(auth) }, "Salir")));

  const tabs = [["hoy", "Tareas"], ["calendario", "Calendario"]]; if (isAdmin()) tabs.push(["equipo", "Equipo"]);
  const nav = h("nav", { class: "tabs", role: "tablist", "aria-label": "Secciones" }, tabs.map(t => {
    const b = h("button", { class: "tabs__item" + (S.view === t[0] ? " activo" : ""), role: "tab", type: "button", "aria-selected": S.view === t[0] ? "true" : "false", onclick: () => { S.view = t[0]; render(); window.scrollTo(0, 0); } });
    b.innerHTML = ICONOS_TAB[t[0]]; b.appendChild(document.createTextNode(t[1]));
    return b;
  }));

  const main = h("main", { class: "app-main", id: "main" }, nav);
  main.appendChild(S.view === "hoy" ? viewHoy() : S.view === "calendario" ? viewCalendario() : viewEquipo());
  $root.appendChild(h("div", { class: "app-shell" }, header, main));
  $root.appendChild(h("button", { class: "btn btn-dorado fab", type: "button", onclick: () => seriesForm(null, S.date, "all") }, "+ Nueva tarea"));
  window.scrollTo(0, keepScroll);
  const again = (keepId && document.getElementById(keepId)) || (keepIdx >= 0 ? $root.querySelectorAll(FOCUSABLE)[keepIdx] : null);
  if (again) again.focus({ preventScroll: true });
}

/* ---------- acceso (mismo diseño que el inicio de sesión del hub) ---------- */
function pantallaAcceso(...contenido) {
  $root.innerHTML = "";
  $root.appendChild(h("main", { class: "pantalla-acceso" }, h("div", { class: "acceso-caja" },
    h("header", { class: "acceso-marca" }, h("div", { class: "acceso-marca__logo", "aria-hidden": "true" }, "✓"), h("div", { class: "acceso-marca__codigo" }, "COGUSA · SGI"),
      h("p", { class: "acceso-marca__nombre" }, "Control de tareas")),
    h("section", { class: "acceso-tarjeta" }, contenido))));
}
function loginView(msg) {
  const email = h("input", { id: "l-e", type: "email", autocomplete: "username", inputmode: "email", placeholder: "nombre@empresasgalindo.com" });
  const pass = h("input", { id: "l-p", type: "password", autocomplete: "current-password", placeholder: "••••••••" });
  const err = h("p", { class: "error-form", role: "alert" }, msg || "");
  const go = h("button", { class: "btn btn-primario", type: "submit" }, "Entrar");
  const form = h("form", { novalidate: true }, campo("Correo electrónico", email, "l-e"), campo("Contraseña", pass, "l-p"), err, h("div", { style: "margin-top:12px" }, go));
  form.addEventListener("submit", async ev => {
    ev.preventDefault(); err.textContent = ""; go.disabled = true;
    try { await signInWithEmailAndPassword(auth, email.value.trim(), pass.value); }
    catch (x) { err.textContent = ["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email"].indexOf(x.code) >= 0 ? "Correo o contraseña incorrectos." : x.code === "auth/too-many-requests" ? "Demasiados intentos. Espera unos minutos." : "No se pudo entrar. Revisa tu conexión."; go.disabled = false; }
  });
  const forgot = h("button", { class: "btn btn-texto btn-sm", type: "button", style: "margin-top:12px", onclick: async () => {
    if (!email.value.trim()) { err.textContent = "Escribe tu correo y vuelve a tocar este botón."; email.focus(); return; }
    try { await sendPasswordResetEmail(auth, email.value.trim()); err.style.color = "var(--menta-tinta)"; err.textContent = "Te enviamos un enlace para crear una contraseña nueva."; } catch (x) { err.textContent = "No se pudo enviar el correo."; }
  } }, "Olvidé mi contraseña");
  pantallaAcceso(
    h("h1", { style: "font-size:22px;margin-bottom:8px" }, "Iniciar sesión"),
    h("p", { class: "texto-suave texto-sm", style: "margin-bottom:20px" }, "Es la misma cuenta del hub. Si ya entraste allí, no hace falta volver a hacerlo."),
    form, forgot);
}
function stopListeners() { unsubs.forEach(u => u()); unsubs = []; stopOcc(); }

/* Registros (occ): se escuchan solo desde una fecha, no la colección completa.
   Hay un documento por tarea por día y crece sin límite; leerlo todo en cada
   apertura costaría miles de lecturas. Por defecto: los últimos DIAS_ATRASO días
   (lo que usan las atrasadas y el Equipo) y todo lo futuro. Si la vista va más
   atrás (calendario o semana anteriores), se amplía. */
let occUnsub = null, occDesde = null, occSinIndice = false;
function stopOcc() { if (occUnsub) occUnsub(); occUnsub = null; occDesde = null; }

/** Primera fecha que necesita la vista actual. */
function fechaMinimaVista() {
  const fechas = [addDays(today(), -DIAS_ATRASO), mondayOf(S.date)];
  if (S.view === "calendario") fechas.push(S.cal + "-01");
  return fechas.sort()[0];
}

/** (Re)abre la escucha de occ si la vista necesita fechas anteriores a las que ya hay. */
function asegurarOcc() {
  if (!S.me) return;
  const desde = fechaMinimaVista();
  if (occUnsub && occDesde <= desde) return;
  if (occUnsub) occUnsub();
  occDesde = desde;
  const uid = S.me.uid, adm = isAdmin();
  const base = collection(db, "occ");
  // El member necesita el índice compuesto occ (assigneeUid, date) de
  // firestore.indexes.json. Si aún no existe, se usa la consulta sin fecha
  // para que la app siga funcionando (y se avisa en la consola).
  const q = adm ? query(base, where("date", ">=", desde))
    : occSinIndice ? query(base, where("assigneeUid", "==", uid))
    : query(base, where("assigneeUid", "==", uid), where("date", ">=", desde));
  occUnsub = onSnapshot(q, snap => {
    S.occ = {}; snap.forEach(d => { S.occ[d.id] = d.data(); }); scheduleRender();
  }, e => {
    if (!adm && !occSinIndice && e.code === "failed-precondition") {
      console.warn("Falta el índice occ (assigneeUid, date). Créalo con el enlace de este error:", e.message);
      occSinIndice = true; occUnsub = null; occDesde = null; asegurarOcc(); return;
    }
    console.error(e); toast("Sin conexión con el servidor.", "error");
  });
}

function startListeners() {
  stopListeners();
  const uid = S.me.uid, adm = isAdmin();
  const sQ = adm ? collection(db, "series") : query(collection(db, "series"), where("assigneeUid", "==", uid));
  const fail = e => { console.error(e); toast("Sin conexión con el servidor.", "error"); };
  unsubs.push(onSnapshot(sQ, snap => { S.series = {}; snap.forEach(d => { S.series[d.id] = Object.assign({ id: d.id }, d.data()); }); scheduleRender(); }, fail));
  if (adm) {
    // Equipo = perfiles propios de Tareas (users) + personas activas del hub
    // (usuarios). Si alguien está en los dos, manda su perfil de users.
    let propios = {}, delHub = {};
    const juntar = () => { S.users = Object.assign({}, delHub, propios); S.users[uid] = S.users[uid] || S.me; scheduleRender(); };
    unsubs.push(onSnapshot(collection(db, "users"), snap => { propios = {}; snap.forEach(d => { propios[d.id] = d.data(); }); juntar(); }, fail));
    unsubs.push(onSnapshot(collection(db, "usuarios"), snap => {
      delHub = {}; snap.forEach(d => { const p = perfilDesdeHub(d.data()); if (p) delHub[d.id] = p; }); juntar();
    }, e => console.warn("No se pudo leer el personal del hub:", e)));
  }
  asegurarOcc();
}

/* Perfil de Tareas: el de users si existe; si no, el del hub (usuarios), con
   gestión del hub (admin/coordinador) como admin y el resto como member.
   Las reglas de Firestore aplican el mismo criterio (tareasAdmin). */
const ROLES_GESTION_HUB = ["admin", "coordinador"];
function perfilDesdeHub(u) {
  if (!u || u.activo === false) return null;
  return { name: u.nombre || u.correo || "Sin nombre", email: u.correo || "", role: ROLES_GESTION_HUB.indexOf(u.rol) >= 0 ? "admin" : "member", rolHub: u.rol || "", desdeHub: true };
}
async function perfilDe(user) {
  const propio = await getDoc(doc(db, "users", user.uid));
  if (propio.exists()) return propio.data();
  const hub = await getDoc(doc(db, "usuarios", user.uid));
  const p = hub.exists() ? perfilDesdeHub(hub.data()) : null;
  if (p && !p.email) p.email = user.email || "";
  return p;
}

/* Cuenta con sesión abierta (p. ej. del hub) pero sin perfil en Tareas. */
function sinPerfilView(user, msg) {
  S.me = null;
  pantallaAcceso(
    h("h1", { style: "font-size:22px;margin-bottom:8px" }, "Aún no tienes acceso"),
    h("p", { class: "texto-sm", style: "margin-bottom:8px" }, "Entraste como ", h("b", null, user.email || "tu cuenta"), "."),
    h("p", { class: "error-form", role: "alert", style: "margin-bottom:20px" }, msg),
    h("a", { class: "btn btn-primario", href: "/hub/", style: "text-decoration:none" }, "Volver al hub"),
    h("button", { class: "btn btn-secundario", type: "button", style: "margin-top:12px", onclick: () => signOut(auth) }, "Entrar con otra cuenta"));
}

function boot() {
  app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
  onAuthStateChanged(auth, async user => {
    stopListeners();
    if (!user) { S.me = null; S.users = {}; S.series = {}; S.occ = {}; loginView(); return; }
    try {
      const perfil = await perfilDe(user);
      // Sin perfil en Tareas ni en el hub: se avisa SIN cerrar la sesión (es la misma del hub).
      if (!perfil) { sinPerfilView(user, "Tu cuenta todavía no está configurada en Tareas. Pide acceso al administrador."); return; }
      S.me = Object.assign({ uid: user.uid }, perfil); S.users[user.uid] = perfil;
      S.date = today(); S.cal = S.date.slice(0, 7); S.view = "hoy";
      startListeners(); render();
    } catch (e) { console.error(e); sinPerfilView(user, "No se pudo cargar tu perfil de Tareas. Revisa tu conexión y recarga la página."); }
  });
}
boot();
</script>
