<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <script src="/js/tema-horario.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060605">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<title>Validación de Reportes - COGUSA SGI</title>
<link rel="stylesheet" href="/css/estilos.css">
<style>
  /* El CSS global solo define .detalle-meta / .titulo-seccion-modal para el
     tema oscuro; se agregan aquí las mismas reglas para el tema claro, que
     hasta ahora se veían sin estilo (bloque plano, sin recuadro). */
  body.tema-reportes .detalle-meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px 18px;
    padding: 12px 14px;
    margin-bottom: 14px;
    background: #f7f7fb;
    border: 1px solid var(--color-borde);
    border-radius: 12px;
  }
  body.tema-reportes .detalle-meta-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  body.tema-reportes .detalle-meta-etq { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--color-texto-suave); }
  body.tema-reportes .detalle-meta-val { color: var(--color-texto); font-weight: 600; word-break: break-word; }
  body.tema-reportes .titulo-seccion-modal { font-size: 1rem; margin: 2px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--color-borde); }

  /* Modal de validación: en tablet/escritorio se ensancha y los campos se
     acomodan en dos columnas para que el formulario completo (incluyendo el
     mapa) quepa en pantalla con el mínimo de scroll posible. En celular se
     mantiene una sola columna. */
  #modal-fondo #mod-descripcion { min-height: 64px; }
  #modal-fondo #mod-observaciones-inspector { min-height: 64px; }
  @media (min-width: 720px) {
    #modal-fondo .modal-caja { max-width: 900px; max-height: 94vh; }
    #modal-fondo .campos-grid-validacion { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    /* Las fotos pasan a una tira angosta y horizontal (en vez de cuadros
       grandes) para no comerse la altura que necesita el mapa más abajo. */
    #modal-fondo .fotos-grid { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding-bottom: 2px; }
    #modal-fondo .fotos-grid > * { width: 92px; flex: 0 0 auto; }
    #modal-fondo .campo { margin-bottom: 14px; }
  }

  /* Las miniaturas del modal se pueden abrir a pantalla completa. */
  #modal-fondo .foto-miniatura { cursor: zoom-in; }

  #visor-foto-fondo {
    position: fixed; inset: 0; z-index: 200; background: rgba(6, 6, 8, 0.94);
    display: none; align-items: center; justify-content: center;
  }
  #visor-foto-fondo.show { display: flex; }
  #visor-foto-fondo img {
    max-width: min(94vw, 1400px); max-height: 90vh;
    width: auto; height: auto; object-fit: contain;
    display: block; margin: auto; border-radius: 6px;
  }
  #visor-foto-fondo .visor-cerrar {
    position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1);
    border: none; color: #fff; width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #visor-foto-fondo .visor-cerrar:hover { background: rgba(255,255,255,0.2); }
  #visor-foto-fondo .visor-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #visor-foto-fondo .visor-nav:hover { background: rgba(255,255,255,0.2); }
  #visor-foto-fondo .visor-anterior { left: 16px; }
  #visor-foto-fondo .visor-siguiente { right: 16px; }
  #visor-foto-fondo .visor-contador {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 13px; background: rgba(255,255,255,0.12);
    padding: 4px 14px; border-radius: 999px;
  }
  @media (max-width: 600px) {
    #visor-foto-fondo .visor-nav { width: 40px; height: 40px; }
  }
</style>
</head>
<body class="tema-reportes">
<div id="app">
  <header class="barra-superior">
    <div class="marca">
      <img src="../assets/logo-empresa.png" alt="Empresas Galindo" class="marca-icono">
      <div class="marca-texto">
        <h1>Validación de reportes</h1>
        <div class="subt" id="nombre-admin"></div>

    </div>
    <nav>
      <!-- Regreso al hub de formatos (pantalla principal del sitio). Ruta
           absoluta a propósito: no depende de la profundidad de carpetas. -->
      <a href="/hub/index.html">← Formatos</a>
      <a href="dashboard.html" data-modulo="dashboard">Dashboard</a>
      <a href="../inspector.html" data-modulo="nuevo-reporte">Nuevo reporte</a>
      <a href="../reportes.html">Reportes</a>
      <a href="validacion.html" class="activo" data-modulo="validacion">Validación</a>

  <main class="contenedor">

<!-- Modal de detalle / validación -->
<div class="modal-fondo" id="modal-fondo" style="display:none;">
  <div class="modal-caja">
    <div class="modal-encabezado">
      <h2>Detalle del reporte</h2>
      <button class="cerrar-modal" id="cerrar-modal" aria-label="Cerrar">

      </button>

    <div class="modal-cuerpo" id="modal-contenido"></div>
    <div class="modal-pie" id="modal-pie"></div>

</div>

<!-- Visor de fotos a pantalla completa (se abre desde las miniaturas del modal) -->
<div id="visor-foto-fondo">
  <button class="visor-cerrar" id="visor-cerrar" aria-label="Cerrar">
    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button class="visor-nav visor-anterior" id="visor-anterior" aria-label="Foto anterior">
    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <img id="visor-foto-img" src="" alt="Foto del hallazgo">
  <button class="visor-nav visor-siguiente" id="visor-siguiente" aria-label="Foto siguiente">
    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/config.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/reportes.js"></script>
<script>
let perfilAdmin = null;
let usuarioAdmin = null;
let estadoActual = "pendiente";
let reportesCache = [];
let gpsCorregidoMod = null;

// "Pendientes" se mantiene en vivo (onSnapshot): son pocos y hay que verlos
// apenas entran. "Validados" puede acumular años de historial, así que se
// pagina de 20 en 20 con consultas puntuales (.get) en vez de escuchar en
// vivo la colección completa — antes se releía TODO lo validado (y cada vez
// que se cambiaba de pestaña se sumaba un listener más sin cerrar el
// anterior), lo cual crecía sin límite con el tiempo.
const REPORTES_POR_PAGINA = 20;
let unsubscribeReportes = null;
let ultimoDocValidados = null;
let hayMasValidados = true;
let cargandoPaginaValidados = false;

protegerPagina("validacion", (user, perfil, permisos) => {
  usuarioAdmin = user;
  perfilAdmin = perfil;
  aplicarVisibilidadNav(perfil, permisos);
  inicializarCampana(perfil, user.uid);
  document.getElementById("nombre-admin").textContent = perfil.nombre || perfil.correo;
  // Borrar reportes es siempre exclusivo del admin, aunque el inspector
  // tenga permiso de validación (corregir no es lo mismo que borrar).
  if (perfil.rol !== "admin") {
    document.getElementById("btn-eliminar-reporte").style.display = "none";
  }
  cargarReportes();
});

document.getElementById("tab-pendientes").addEventListener("click", () => { estadoActual = "pendiente"; cargarReportes(); });
document.getElementById("tab-validados").addEventListener("click", () => { estadoActual = "validado"; cargarReportes(); });

function cargarReportes() {
  document.getElementById("tab-pendientes").classList.toggle("activo", estadoActual === "pendiente");
  document.getElementById("tab-validados").classList.toggle("activo", estadoActual === "validado");

  if (unsubscribeReportes) { unsubscribeReportes(); unsubscribeReportes = null; }
  reportesCache = [];
  ultimoDocValidados = null;
  hayMasValidados = true;
  document.getElementById("btn-cargar-mas").style.display = "none";

  if (estadoActual === "pendiente") {
    unsubscribeReportes = colReportes.where("estado", "==", "pendiente").orderBy("creadoEn", "desc")
      .onSnapshot((snap) => {
        reportesCache = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderizarRejilla();
      }, (err) => {
        console.error(err);
        document.getElementById("rejilla-reportes").innerHTML = "";
        document.getElementById("lista-vacia").style.display = "block";
        document.getElementById("lista-vacia").textContent = "Error cargando reportes. Verifique su conexión.";
      });
  } else {
    cargarPaginaValidados();
  }
}

async function cargarPaginaValidados() {
  if (cargandoPaginaValidados || !hayMasValidados) return;
  cargandoPaginaValidados = true;
  actualizarBotonCargarMas();
  try {
    let consulta = colReportes.where("estado", "==", "validado").orderBy("creadoEn", "desc").limit(REPORTES_POR_PAGINA);
    if (ultimoDocValidados) consulta = consulta.startAfter(ultimoDocValidados);
    const snap = await consulta.get();
    reportesCache = reportesCache.concat(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    ultimoDocValidados = snap.docs.length ? snap.docs[snap.docs.length - 1] : ultimoDocValidados;
    hayMasValidados = snap.docs.length === REPORTES_POR_PAGINA;
    renderizarRejilla();
  } catch (err) {
    console.error(err);
    document.getElementById("rejilla-reportes").innerHTML = "";
    document.getElementById("lista-vacia").style.display = "block";
    document.getElementById("lista-vacia").textContent = "Error cargando reportes. Verifique su conexión.";
  } finally {
    cargandoPaginaValidados = false;
    actualizarBotonCargarMas();
  }
}

function actualizarBotonCargarMas() {
  const btn = document.getElementById("btn-cargar-mas");
  if (estadoActual !== "validado" || !hayMasValidados) {
    btn.style.display = "none";
    return;
  }
  btn.style.display = "inline-flex";
  btn.disabled = cargandoPaginaValidados;
  btn.textContent = cargandoPaginaValidados ? "Cargando..." : "Cargar 20 más";
}
document.getElementById("btn-cargar-mas").addEventListener("click", cargarPaginaValidados);

function renderizarRejilla() {
  const rejilla = document.getElementById("rejilla-reportes");
  const vacio = document.getElementById("lista-vacia");
  rejilla.innerHTML = "";
  vacio.style.display = reportesCache.length ? "none" : "block";
  vacio.textContent = "No hay reportes en esta bandeja.";

  const iconoUsuario = `<svg class="icono icono-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
  const iconoReloj = `<svg class="icono icono-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;

  reportesCache.forEach((r) => {
    const div = document.createElement("div");
    div.className = "tarjeta tarjeta-reporte";
    div.innerHTML = `
      <div class="foto-portada">
        ${r.fotos && r.fotos[0] ? `<img src="${r.fotos[0]}">` : ""}
        ${r.gravedad ? `<span class="etiqueta-gravedad ${claseGravedad(r.gravedad)}">${r.gravedad}</span>` : ""}
      </div>
      <div class="cuerpo">
        <h3>${r.zona} — ${r.proceso}</h3>
        <p>${(r.descripcion || "").slice(0, 90)}${r.descripcion && r.descripcion.length > 90 ? "..." : ""}</p>
        <div class="meta">
          <p>${iconoUsuario} ${r.inspectorNombre}</p>
        </div>
        <div class="meta">
          <p>${iconoReloj} ${formatearFechaHora(r.fechaHora)}${r.turno ? " · " + r.turno : ""}</p>
        </div>
      </div>
    `;
    div.addEventListener("click", () => abrirModal(r));
    rejilla.appendChild(div);
  });
}

function abrirModal(reporte) {
  const modal = document.getElementById("modal-fondo");
  const contenido = document.getElementById("modal-contenido");

  // El modal debe quedar visible ANTES de cargar el plano: si se inicializa
  // dentro de un contenedor con display:none, mide 0x0 y renderiza en
  // blanco/incompleto (se veía sobre todo en tablets).
  modal.style.display = "flex";

  contenido.innerHTML = `
    <div class="fotos-grid" style="margin-bottom:12px;">
      ${reporte.fotos.map((f, i) => `<div class="foto-miniatura" data-idx="${i}"><img src="${f}"></div>`).join("")}
    </div>
    <div class="detalle-meta">
      <div class="detalle-meta-item"><span class="detalle-meta-etq">Inspector</span><span class="detalle-meta-val">${reporte.inspectorNombre}</span></div>
      <div class="detalle-meta-item"><span class="detalle-meta-etq">Fecha</span><span class="detalle-meta-val">${formatearFechaHora(reporte.fechaHora)}</span></div>
      <div class="detalle-meta-item"><span class="detalle-meta-etq">GPS del inspector</span><span class="detalle-meta-val">${reporte.gps ? reporte.gps.lat.toFixed(5) + ", " + reporte.gps.lng.toFixed(5) : "No disponible (" + (reporte.gpsError || "sin dato") + ")"}</span></div>
    </div>

    <h3 class="titulo-seccion-modal">Datos a validar</h3>
    <div class="campo">
      <label>Descripción del hallazgo</label>
      <textarea id="mod-descripcion" rows="3" placeholder="Describa el hallazgo...">${(reporte.descripcion || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")}</textarea>
    </div>

    <div class="campos-grid-validacion">
      <div class="campo">
        <label>Turno</label>
        <select id="mod-turno">
          <option value="">Sin especificar</option>
          ${NIVELES_TURNO_REPORTE.map((t) => `<option value="${t}" ${reporte.turno === t ? "selected" : ""}>${t}</option>`).join("")}
        </select>
      </div>
      <div class="campo autocompletar">
        <label>Zona</label>
        <input type="text" id="mod-zona" value="${reporte.zona}" autocomplete="off">
        <div class="lista-sugerencias" id="mod-lista-zona" style="display:none;"></div>
      </div>
      <div class="campo">
        <label>Proceso</label>
        <select id="mod-proceso"></select>
      </div>
      <div class="campo">
        <label>Categoría</label>
        <select id="mod-categoria"></select>
        ${!reporte.categoria && reporte.puntoNormaTexto ? `<p class="ayuda">Punto de norma (histórico, ya no editable): ${reporte.puntoNormaTexto}${reporte.noAplicaNorma ? " — No aplica" : ""}</p>` : ""}
      </div>
      <div class="campo">
        <label>Gravedad *</label>
        <select id="mod-gravedad">
          <option value="">-- Seleccione --</option>
          ${NIVELES_GRAVEDAD.map((g) => `<option value="${g}" ${reporte.gravedad === g ? "selected" : ""}>${g}</option>`).join("")}
        </select>
      </div>
      <div class="campo">
        <label>Observaciones para el inspector (opcional)</label>
        <textarea id="mod-observaciones-inspector" placeholder="Ej: se corrigió la zona porque no correspondía a esa área. Este mensaje se le mostrará al inspector como retroalimentación."></textarea>
      </div>
    </div>

    ${reporte.estado === "validado" ? `<p class="aviso aviso-exito">Validado por ${reporte.validadoPorNombre} el ${formatearFechaHora(reporte.fechaValidacion)}</p>` : ""}

    <div id="zona-eliminar" style="margin-top:6px; padding-top:14px; border-top:1px solid var(--color-borde);">
      <button class="btn btn-peligro btn-pequeno" id="btn-eliminar-reporte">
        <svg class="icono icono-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        Eliminar este reporte
      </button>
      <div id="confirmar-eliminar" style="display:none; margin-top:10px;">
        <p class="aviso aviso-error">Esta acción es permanente y no se puede deshacer (se perderán también las fotos asociadas del registro). ¿Confirma que desea eliminar este reporte?</p>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-peligro" id="btn-confirmar-eliminar">Sí, eliminar definitivamente</button>
          <button class="btn btn-secundario" id="btn-cancelar-eliminar">Cancelar</button>
        </div>
      </div>
    </div>

    <div class="campo" style="margin-top:16px; margin-bottom:0;">
      <label>Punto del hallazgo en el plano (toque el plano si necesita corregirlo)</label>
      <div class="contenedor-plano" id="mod-contenedor-plano" style="margin-top:8px;"></div>
    </div>
  `;

  document.getElementById("modal-pie").innerHTML = `
    <button class="btn btn-exito" id="btn-guardar-validacion">Guardar validación</button>
  `;

  // --- Plano de la planta con el pin del hallazgo (el que marcan los
  // inspectores manualmente en el reporte) — único mapa de este modal. Si el
  // admin lo corrige tocando el plano, la posición GPS guardada se recalcula
  // con la misma calibración (4 esquinas) que usa el resto del sistema, para
  // que ambos datos queden siempre consistentes.
  let planoPuntoMod = reporte.planoPunto || null;
  // Reportes antiguos guardaban el punto en coordenadas 0-1000 del plano
  // esquemático anterior; se descartan para recalcular desde el GPS.
  if (planoPuntoMod && (planoPuntoMod.x > 100 || planoPuntoMod.y > 100)) planoPuntoMod = null;
  gpsCorregidoMod = reporte.gps || null;
  let esquinasPlanoMod = null;

  Promise.all([
    cargarPlanoImagenReal(document.getElementById("mod-contenedor-plano")),
    obtenerEsquinasPlanoGPS()
  ]).then(([marco, esquinas]) => {
    esquinasPlanoMod = esquinas;
    if (!planoPuntoMod && esquinas && reporte.gps) {
      planoPuntoMod = gpsAPuntoPlano(reporte.gps, esquinas);
    }
    if (planoPuntoMod) {
      marcarPinEnPlano(marco, planoPuntoMod);
      enfocarPuntoPlano(marco, planoPuntoMod);
    }
    habilitarSeleccionPuntoPlanoReal(marco, (punto) => {
      planoPuntoMod = punto;
      if (esquinasPlanoMod) gpsCorregidoMod = puntoPlanoAGPS(punto, esquinasPlanoMod);
    });
  });

  // --- Fotos: abren a pantalla completa al tocarlas -----------------------
  contenido.querySelectorAll(".foto-miniatura").forEach((el) => {
    el.addEventListener("click", () => abrirVisorFoto(reporte.fotos, Number(el.dataset.idx)));
  });

  crearAutocompletarConCreacion({
    inputEl: document.getElementById("mod-zona"),
    listaEl: document.getElementById("mod-lista-zona"),
    coleccion: colZonas,
    uidUsuario: usuarioAdmin.uid,
    onSeleccion: () => {}
  });
  poblarSelectProcesos(document.getElementById("mod-proceso"), reporte.proceso);
  poblarSelectCategorias(document.getElementById("mod-categoria"), reporte.categoria);

  document.getElementById("btn-guardar-validacion").addEventListener("click", async () => {
    const gravedad = document.getElementById("mod-gravedad").value;
    if (!gravedad) { mostrarAvisoGlobal("Debe seleccionar la gravedad del hallazgo.", "advertencia"); return; }

    const nuevos = {
      turno: document.getElementById("mod-turno").value || null,
      zona: document.getElementById("mod-zona").value.trim(),
      proceso: document.getElementById("mod-proceso").value.trim(),
      categoria: document.getElementById("mod-categoria").value.trim() || null,
      descripcion: document.getElementById("mod-descripcion").value.trim(),
      gps: gpsCorregidoMod,
      gravedad
    };
    const mensajeInspector = document.getElementById("mod-observaciones-inspector").value.trim();

    // Retroalimentación para el inspector: comparación campo por campo entre
    // lo que registró originalmente y cómo quedó, más el mensaje opcional.
    // Si no hay nada que avisar (una revalidación sin cambios y sin mensaje
    // nuevo), no se le notifica de nuevo.
    const comparacion = construirComparacionCambios(reporte, nuevos);
    const hayNotificacion = comparacion.hayDiferencias || !!mensajeInspector;

    const cambios = {
      ...nuevos,
      planoPunto: planoPuntoMod,
      estado: "validado",
      validadoPor: usuarioAdmin.uid,
      validadoPorNombre: perfilAdmin.nombre || perfilAdmin.correo,
      validadoPorPuesto: perfilAdmin.puesto || null,
      fechaValidacion: firebase.firestore.FieldValue.serverTimestamp(),
      historialValidacion: firebase.firestore.FieldValue.arrayUnion({
        uid: usuarioAdmin.uid,
        nombre: perfilAdmin.nombre || perfilAdmin.correo,
        puesto: perfilAdmin.puesto || null,
        fecha: new Date().toISOString(),
        gravedad
      })
    };
    if (hayNotificacion) {
      cambios.cambioSinVer = true;
      cambios.ultimoCambioAdmin = {
        uid: usuarioAdmin.uid,
        nombre: perfilAdmin.nombre || perfilAdmin.correo,
        fecha: firebase.firestore.FieldValue.serverTimestamp(),
        mensaje: mensajeInspector || null,
        campos: comparacion.campos,
        ubicacionCorregida: comparacion.ubicacionCorregida
      };
    }

    try {
      await colReportes.doc(reporte.id).update(cambios);
      cerrarModal();
    } catch (err) {
      console.error(err);
      mostrarAvisoGlobal("No se pudo guardar la validación. Verifique su conexión e intente de nuevo.", "error");
    }
  });

  // --- Eliminar reporte (con confirmación en dos pasos, sin diálogos nativos) ---
  document.getElementById("btn-eliminar-reporte").addEventListener("click", () => {
    document.getElementById("btn-eliminar-reporte").style.display = "none";
    document.getElementById("confirmar-eliminar").style.display = "block";
  });
  document.getElementById("btn-cancelar-eliminar").addEventListener("click", () => {
    document.getElementById("confirmar-eliminar").style.display = "none";
    document.getElementById("btn-eliminar-reporte").style.display = "inline-flex";
  });
  document.getElementById("btn-confirmar-eliminar").addEventListener("click", async () => {
    const btn = document.getElementById("btn-confirmar-eliminar");
    btn.disabled = true;
    btn.textContent = "Eliminando...";
    try {
      await colReportes.doc(reporte.id).delete();
      mostrarAvisoGlobal("Reporte eliminado correctamente.", "exito");
      cerrarModal();
    } catch (err) {
      console.error(err);
      mostrarAvisoGlobal("No se pudo eliminar el reporte. Verifique su conexión e intente de nuevo.", "error");
      btn.disabled = false;
      btn.textContent = "Sí, eliminar definitivamente";
    }
  });
}

function cerrarModal() {
  document.getElementById("modal-fondo").style.display = "none";
}
document.getElementById("cerrar-modal").addEventListener("click", cerrarModal);
document.getElementById("modal-fondo").addEventListener("click", (e) => { if (e.target.id === "modal-fondo") cerrarModal(); });

// --- Visor de fotos a pantalla completa -------------------------------
let visorFotos = [];
let visorIndice = 0;
const visorFondo = document.getElementById("visor-foto-fondo");
const visorImg = document.getElementById("visor-foto-img");
const visorContador = document.getElementById("visor-contador");

function abrirVisorFoto(fotos, indice) {
  visorFotos = fotos || [];
  visorIndice = indice || 0;
  mostrarFotoVisor();
  visorFondo.classList.add("show");
}

function mostrarFotoVisor() {
  visorImg.src = visorFotos[visorIndice];
  const hayVarias = visorFotos.length > 1;
  document.getElementById("visor-anterior").style.display = hayVarias ? "flex" : "none";
  document.getElementById("visor-siguiente").style.display = hayVarias ? "flex" : "none";
  visorContador.style.display = hayVarias ? "block" : "none";
  visorContador.textContent = (visorIndice + 1) + " / " + visorFotos.length;
}

function cerrarVisorFoto() {
  visorFondo.classList.remove("show");
  visorImg.src = "";
}

function fotoAnterior() { visorIndice = (visorIndice - 1 + visorFotos.length) % visorFotos.length; mostrarFotoVisor(); }
function fotoSiguiente() { visorIndice = (visorIndice + 1) % visorFotos.length; mostrarFotoVisor(); }

document.getElementById("visor-cerrar").addEventListener("click", cerrarVisorFoto);
document.getElementById("visor-anterior").addEventListener("click", fotoAnterior);
document.getElementById("visor-siguiente").addEventListener("click", fotoSiguiente);
visorFondo.addEventListener("click", (e) => { if (e.target === visorFondo) cerrarVisorFoto(); });
document.addEventListener("keydown", (e) => {
  if (!visorFondo.classList.contains("show")) return;
  if (e.key === "Escape") cerrarVisorFoto();
  else if (e.key === "ArrowLeft") fotoAnterior();
  else if (e.key === "ArrowRight") fotoSiguiente();
});
</script>
