<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <base href="/hub/sig-fo-101/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f38" />
  <title>Nueva Liberación · SIG-FO-101</title>
  <link rel="stylesheet" href="/hub/sig-fo-101/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__marca">
        <div class="app-header__titulo">SIG-FO-101 · Liberación</div>
        <div class="app-header__subtitulo" id="texto-usuario">—</div>
      </div>
      <div class="app-header__acciones">
        <a href="../inspecciones.html" class="btn btn-texto btn-sm" style="color:#fff;">← 115</a>
        <button id="btn-salir" class="btn btn-texto btn-sm" type="button" style="color:#fff;">Salir</button>
      </div>
    </header>

    <div id="barra-offline" class="barra-offline oculto"></div>

    <main class="app-main">
      <section class="tarjeta">
        <h2 class="tarjeta__titulo">Fecha y turno</h2>
        <div class="campo">
          <label for="campo-fecha">Fecha de inspección</label>
          <input type="date" id="campo-fecha" required />
        </div>
        <div class="campo mb-0">
          <label id="etiqueta-turno">Turno</label>
          <div class="segmentos" id="segmentos-turno" role="group" aria-labelledby="etiqueta-turno">
            <label>
              <input type="radio" name="turno" value="1" />
              <span class="segmento">Turno 1</span>
            </label>
            <label>
              <input type="radio" name="turno" value="2" />
              <span class="segmento">Turno 2</span>
            </label>
            <label>
              <input type="radio" name="turno" value="3" />
              <span class="segmento">Turno 3</span>
            </label>
          </div>
          <p class="campo-ayuda">Se elige solo según la hora; toca otro turno si el dispositivo se equivocó.</p>
        </div>
      </section>

      <section class="tarjeta">
        <h2 class="tarjeta__titulo">Máquina</h2>
        <div class="chips" id="chips-maquina"></div>
      </section>

      <section class="tarjeta">
        <h2 class="tarjeta__titulo">Orden y cliente</h2>
        <div class="campo">
          <label for="campo-orden">No. de Orden</label>
          <input type="text" id="campo-orden" inputmode="numeric" autocomplete="off" required />
        </div>
        <div class="campo mb-0">
          <label for="campo-cliente">Cliente</label>
          <input type="text" id="campo-cliente" list="lista-clientes" autocomplete="off" required />
          <datalist id="lista-clientes"></datalist>
        </div>
      </section>

      <section class="tarjeta">
        <h2 class="tarjeta__titulo">Limpieza y Sanitización</h2>
        <div id="preguntas-contenedor" class="preguntas-lista"></div>

        <div class="campo" id="campo-observaciones-cont" style="margin-top: 16px;">
          <label for="campo-observaciones" id="etiqueta-observaciones">Observaciones (opcional)</label>
          <textarea id="campo-observaciones" placeholder="Describe el hallazgo…"></textarea>
        </div>
      </section>

      <button type="button" id="btn-liberar" class="btn btn-dorado btn-liberar">
        LIBERAR
      </button>
    </main>

    <nav class="nav-inferior" aria-label="Navegación principal">
      <a href="index.html" class="nav-inferior__item activo" aria-current="page">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Nuevo
      </a>
      <a href="historial.html" class="nav-inferior__item">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
        Historial
      </a>
      <a href="../configuraciones.html" class="nav-inferior__item oculto" id="link-admin">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.07 14H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63c.6-.26 1.02-.85 1.04-1.51V3a2 2 0 0 1 4 0v.09c.02.66.44 1.25 1.04 1.51.66.28 1.42.14 1.93-.37l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06c-.5.5-.65 1.27-.37 1.93.26.6.85 1.02 1.51 1.04H21a2 2 0 0 1 0 4h-.09c-.66.02-1.25.44-1.51 1.04Z"/></svg>
        Config
      </a>
    </nav>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script type="module" src="/hub/sig-fo-101/app.js"></script>
</body>
</html>
