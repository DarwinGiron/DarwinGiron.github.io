<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <base href="/hub/sig-fo-101/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f38" />
  <title>Iniciar sesión · SIG-FO-101</title>
  <link rel="stylesheet" href="/hub/sig-fo-101/styles.css" />
</head>
<body>
  <div class="app-shell" style="justify-content: center;">
    <main class="app-main" style="padding-top: 40px; padding-bottom: 40px;">
      <div class="texto-centro" style="margin-bottom: 24px;">
        <div style="font-size: 13px; font-weight: 800; color: var(--marino-700); letter-spacing: 0.04em;">
          COGUSA · CORRUGADORA GUATEMALA, S.A.
        </div>
        <h1 style="margin: 6px 0 2px; font-size: 22px; color: var(--marino-900);">SIG-FO-101</h1>
        <p class="texto-suave texto-sm mb-0">Control de Liberación de Operación de Convertidoras</p>
      </div>

      <form id="form-login" class="tarjeta" novalidate>
        <div class="campo">
          <label for="campo-email">Correo</label>
          <input type="email" id="campo-email" autocomplete="username" required />
        </div>
        <div class="campo">
          <label for="campo-password">Contraseña</label>
          <input type="password" id="campo-password" autocomplete="current-password" required />
        </div>
        <button type="submit" id="btn-entrar" class="btn btn-primario">Entrar</button>
        <p class="texto-suave texto-xs" style="margin: 14px 0 0;">
          ¿No tienes cuenta? Pídele al Coordinador de SGIA que te dé de alta.
        </p>
      </form>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script type="module" src="/hub/sig-fo-101/login.js"></script>
</body>
</html>
