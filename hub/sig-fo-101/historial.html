<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <base href="/hub/sig-fo-101/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f38" />
  <title>Historial · SIG-FO-101</title>
  <link rel="stylesheet" href="/hub/sig-fo-101/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__marca">
        <div class="app-header__titulo">SIG-FO-101 · Historial</div>
        <div class="app-header__subtitulo" id="texto-usuario">—</div>
      </div>
      <div class="app-header__acciones">
        <a href="../index.html" class="btn btn-texto btn-sm" style="color:#fff;">← Hub</a>
        <button id="btn-salir" class="btn btn-texto btn-sm" type="button" style="color:#fff;">Salir</button>
      </div>
    </header>

    <main class="app-main">
      <section class="tarjeta">
        <h2 class="tarjeta__titulo">Filtros</h2>
        <div class="filtros">
          <div class="campo mb-0">
            <label for="filtro-fecha">Fecha</label>
            <input type="date" id="filtro-fecha" />
          </div>
          <div class="campo mb-0">
            <label for="filtro-maquina">Máquina</label>
            <select id="filtro-maquina">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="campo mb-0">
            <label for="filtro-turno">Turno</label>
            <select id="filtro-turno">
              <option value="">Todos</option>
              <option value="1">Turno 1</option>
              <option value="2">Turno 2</option>
              <option value="3">Turno 3</option>
            </select>
          </div>
          <div class="campo mb-0" style="align-self: end;">
            <button type="button" id="btn-filtrar" class="btn btn-primario btn-sm">Aplicar filtros</button>
          </div>
        </div>
        <div class="grupo-botones" style="margin-top: 14px;">
          <button type="button" id="btn-limpiar-filtros" class="btn btn-secundario btn-sm btn-ancho-auto oculto">
            Limpiar filtros
          </button>
        </div>
      </section>

      <section class="tarjeta">
        <h2 class="tarjeta__titulo" id="titulo-lista">Últimas 20 liberaciones</h2>

        <div id="lista-tarjetas" class="solo-movil"></div>

        <div class="solo-escritorio" style="overflow-x: auto;">
          <table class="tabla-historial">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Turno</th>
                <th>Máquina</th>
                <th>Orden</th>
                <th>Cliente</th>
                <th>L/S</th>
                <th>Inspector</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla"></tbody>
          </table>
        </div>

        <button type="button" id="btn-cargar-mas" class="btn btn-secundario btn-sm" style="margin-top: 14px;">
          Cargar más
        </button>
      </section>
    </main>

    <nav class="nav-inferior" aria-label="Navegación principal">
      <a href="index.html" class="nav-inferior__item">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Nuevo
      </a>
      <a href="historial.html" class="nav-inferior__item activo" aria-current="page">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
        Historial
      </a>
      <a href="../configuraciones.html" class="nav-inferior__item oculto" id="link-admin">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.07 14H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63c.6-.26 1.02-.85 1.04-1.51V3a2 2 0 0 1 4 0v.09c.02.66.44 1.25 1.04 1.51.66.28 1.42.14 1.93-.37l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06c-.5.5-.65 1.27-.37 1.93.26.6.85 1.02 1.51 1.04H21a2 2 0 0 1 0 4h-.09c-.66.02-1.25.44-1.51 1.04Z"/></svg>
        Config
      </a>
    </nav>
  </div>

  <!-- Modal de edición: reutiliza los mismos controles de captura -->
  <div id="modal-editar" class="modal-fondo oculto">
    <div class="modal-caja">
      <div class="modal-caja__cabecera">
        <h3>Corregir liberación</h3>
        <button type="button" id="btn-cerrar-modal" class="btn btn-texto btn-sm">✕</button>
      </div>

      <div class="campo">
        <label for="edit-maquina">Máquina</label>
        <select id="edit-maquina"></select>
      </div>
      <div class="campo">
        <label for="edit-orden">No. de Orden</label>
        <input type="text" id="edit-orden" inputmode="numeric" />
      </div>
      <div class="campo">
        <label for="edit-cliente">Cliente</label>
        <input type="text" id="edit-cliente" />
      </div>
      <div class="campo">
        <label>Limpieza y Sanitización</label>
        <div id="edit-preguntas-contenedor" class="preguntas-lista"></div>
      </div>
      <div class="campo mb-0">
        <label for="edit-observaciones">Observaciones</label>
        <textarea id="edit-observaciones"></textarea>
      </div>

      <button type="button" id="btn-guardar-edicion" class="btn btn-primario" style="margin-top: 18px;">
        Guardar corrección
      </button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script type="module" src="/hub/sig-fo-101/historial.js"></script>
</body>
</html>
