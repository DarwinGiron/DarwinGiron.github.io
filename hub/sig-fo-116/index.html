<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="/js/tema-horario.js"></script>
<base href="/hub/sig-fo-116/" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Auditoría de BPM · SIG-FO-116</title>
<style>
  :root{
    --navy:#0F2A4A;
    --navy-light:#1B3D63;
    --navy-soft:#EAF0F6;
    --gold:#C6A15B;
    --gold-dark:#A9843F;
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --line:#E3E0D7;
    --text:#1A1F26;
    --text-soft:#5B6270;
    --ok:#2F8F5B;
    --ok-bg:#E4F3EA;
    --bad:#C24444;
    --bad-bg:#FBEAEA;
    --na:#8A8F98;
    --na-bg:#EEEEF0;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:96px;
  }
  button{font-family:inherit;}

  /* Tira de sesión: no existía en el prototipo original — se agregó para
     integrarlo al resto del hub (volver al inicio, saber quién llenó la
     auditoría, poder salir sin tener que cerrar la pestaña). */
  .sesion-bar{
    background:var(--navy-light);
    color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 18px;font-size:12.5px;
  }
  .sesion-bar a.volver{color:var(--gold);text-decoration:none;font-weight:700;}
  .sesion-bar a.volver:hover{text-decoration:underline;}
  .sesion-usuario{display:flex;align-items:center;gap:8px;}
  .sesion-avatar{
    width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;
  }
  .sesion-usuario button{
    border:none;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;
    padding:4px 12px;font-size:11.5px;font-weight:700;cursor:pointer;
  }
  .sesion-usuario button:hover{background:rgba(255,255,255,.2);}

  /* Header: no es sticky — en tablet se lleva demasiado espacio fijo.
     Se ve completo solo arriba del todo (para registrar fecha/auditor/área)
     y se va con el scroll; lo único que queda fijo son las pestañas. */
  header.top{
    background:linear-gradient(155deg,var(--navy) 0%,var(--navy-light) 100%);
    color:#fff;
    padding:16px 18px 14px;
    box-shadow:0 2px 10px rgba(15,42,74,.18);
  }
  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{
    font-size:11px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--gold);font-weight:700;
  }
  .brand h1{margin:0;font-size:19px;font-weight:700;line-height:1.25;}
  .brand .sub{font-size:12.5px;color:#C7D2E0;}
  .global-chip{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    border-radius:999px;
    padding:6px 14px 6px 6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    transition:background .2s ease;
  }
  .global-chip .ring{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;
    background:conic-gradient(var(--gold) calc(var(--pct,0)*1%), rgba(255,255,255,.18) 0);
  }
  .global-chip .ring span{
    background:var(--navy);width:29px;height:29px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:10.5px;
  }
  .global-chip .label{font-size:11px;color:#C7D2E0;line-height:1.2;}
  .global-chip .qual{font-size:13.5px;font-weight:700;line-height:1.2;}

  .meta-row{
    display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;
  }
  .meta-field{
    display:flex;flex-direction:column;gap:3px;flex:1;min-width:150px;
  }
  .meta-field label{font-size:11px;color:#AEC0D6;letter-spacing:.03em;}
  .meta-field input{
    background:rgba(255,255,255,.95);
    border:1px solid rgba(255,255,255,.2);
    border-radius:8px;
    padding:8px 10px;
    font-size:14.5px;
    color:var(--navy);
  }

  /* Tabs: es lo único que queda fijo arriba al hacer scroll — el header
     grande (sesión, marca, metadatos) se va con el contenido. */
  nav.tabs{
    position:sticky;top:0;z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 6px rgba(15,42,74,.06);
    display:flex;align-items:center;gap:6px;
    padding:0 8px;
  }
  .tabset{
    flex:1;min-width:0;
    display:flex;overflow-x:auto;
    scrollbar-width:none;
  }
  .tabset::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    border:none;background:transparent;
    padding:12px 16px 10px;
    font-size:13.5px;font-weight:600;color:var(--text-soft);
    border-bottom:3px solid transparent;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    cursor:pointer;white-space:nowrap;
    transition:color .15s ease,border-color .15s ease;
  }
  nav.tabs button:hover{color:var(--navy);}
  nav.tabs button .badge{
    font-size:10.5px;font-weight:700;color:var(--text-soft);
    background:var(--bg);border-radius:999px;padding:1px 8px;
  }
  nav.tabs button.active{color:var(--navy);border-bottom-color:var(--gold);}
  nav.tabs button.active .badge{background:var(--navy-soft);color:var(--navy);}
  nav.tabs button.complete .badge{background:var(--ok-bg);color:var(--ok);}

  /* Anillo de % compacto, vive junto a las pestañas para que el avance
     siga visible aunque el header grande ya haya salido del viewport.
     Sube gradualmente con globalScore() — nunca salta a un valor fijo. */
  .tabs-ring{
    flex:0 0 auto;
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;
    background:conic-gradient(var(--gold) calc(var(--pct,0)*1%), var(--bg) 0);
  }
  .tabs-ring span{
    background:var(--surface);width:23px;height:23px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:8.5px;color:var(--navy);
  }

  /* Main */
  main{max-width:900px;margin:0 auto;padding:16px 14px 30px;}

  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin:4px 2px 14px;flex-wrap:wrap;
  }
  .section-head h2{margin:0;font-size:17px;color:var(--navy);}
  .section-head .score{
    font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;
  }
  .toolbar{display:flex;gap:8px;margin-bottom:12px;}
  .toolbar button{
    border:1px solid var(--line);background:var(--surface);
    border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--text-soft);
    cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .toolbar button:hover{background:var(--navy-soft);color:var(--navy);}

  details.group{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(15,42,74,.05);
  }
  details.group summary{
    list-style:none;cursor:pointer;
    padding:13px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-weight:700;font-size:14.5px;color:var(--navy);
  }
  details.group summary::-webkit-details-marker{display:none;}
  details.group summary .meta-count{
    font-size:12px;font-weight:600;color:var(--text-soft);
    background:var(--bg);border-radius:999px;padding:2px 10px;
  }
  details.group summary::before{
    content:'▸';margin-right:8px;color:var(--gold-dark);
    transition:transform .15s ease;
  }
  details.group[open] summary::before{transform:rotate(90deg);}

  .q-row{
    padding:14px 16px;
    border-top:1px solid var(--line);
    display:flex;flex-direction:column;gap:10px;
  }
  .q-row.answered-SI{background:linear-gradient(0deg,rgba(47,143,91,.04),rgba(47,143,91,.04));}
  .q-row.answered-NO{background:linear-gradient(0deg,rgba(194,68,68,.045),rgba(194,68,68,.045));}
  .q-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;}
  .q-text{font-size:14.5px;line-height:1.42;flex:1;}
  .q-num{color:var(--gold-dark);font-weight:800;margin-right:6px;}
  .note-toggle{
    flex:0 0 auto;border:none;background:transparent;color:var(--text-soft);
    font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px;
    display:flex;align-items:center;gap:4px;
  }
  .note-toggle.has-note{color:var(--gold-dark);font-weight:700;}

  .seg{display:flex;gap:8px;flex-wrap:wrap;}
  .seg button{
    flex:1;min-width:78px;
    border:1.5px solid var(--line);
    background:var(--surface);
    border-radius:9px;
    padding:11px 6px;
    font-size:13.5px;font-weight:700;
    color:var(--text-soft);
    cursor:pointer;
    transition:all .12s ease;
  }
  .seg button:hover{border-color:var(--navy-light);}
  .seg button.si.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
  .seg button.no.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
  .seg button.na.on{background:var(--na-bg);border-color:var(--na);color:var(--na);}

  textarea.obs{
    width:100%;min-height:56px;border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;font-size:13.5px;
    font-family:inherit;resize:vertical;color:var(--text);
    background:#FCFBF8;
  }
  textarea.obs::placeholder{color:#A6ABB3;}

  /* Footer */
  footer.bar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:10px 14px;
    display:flex;gap:10px;align-items:center;
    box-shadow:0 -4px 14px rgba(0,0,0,.06);
    z-index:30;
  }
  footer.bar .status{flex:1;font-size:12px;color:var(--text-soft);}
  footer.bar .status b{color:var(--navy);}
  footer.bar button{
    border:none;border-radius:9px;padding:11px 16px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .btn-secondary{background:var(--navy-soft);color:var(--navy);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:active{background:var(--navy-light);}

  /* History overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(15,20,26,.45);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--surface);width:100%;max-width:640px;
    border-radius:16px 16px 0 0;max-height:80vh;overflow:auto;
    padding:18px 18px 26px;
  }
  .sheet h3{margin:0 0 4px;color:var(--navy);}
  .sheet .close{
    position:sticky;top:0;float:right;border:none;background:var(--bg);
    border-radius:8px;padding:6px 10px;font-weight:700;color:var(--text-soft);cursor:pointer;
  }
  .hist-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 4px;border-bottom:1px solid var(--line);gap:10px;
  }
  .hist-item .l{font-size:13.5px;}
  .hist-item .l small{display:block;color:var(--text-soft);font-size:11.5px;}
  .hist-item button{
    border:1px solid var(--line);background:var(--bg);border-radius:8px;
    padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;
  }
  .toast{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;padding:9px 18px;border-radius:999px;
    font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;
    transition:all .25s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .doc-code{font-size:10.5px;color:#93A5BC;letter-spacing:.03em;}

  @media (min-width:640px){
    .q-top{align-items:center;}
    .q-row{flex-direction:row;align-items:flex-start;}
    .q-top{flex:1 1 55%;}
    .seg{flex:0 0 260px;}
  }
</style>
</head>
<body>

<div class="sesion-bar">
  <a href="/hub/index.html" class="volver">← Inicio</a>
  <div class="sesion-usuario">
    <div class="sesion-avatar" id="avatarUsuario">—</div>
    <span id="nombreUsuario">—</span>
    <button type="button" id="btnSalir">Salir</button>
  </div>
</div>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <span class="eyebrow">COGUSA · Empresas Galindo</span>
      <h1>Auditoría de Buenas Prácticas de Manufactura</h1>
      <span class="sub doc-code">SIG-FO-116 · Rev. 00 · Control mensual</span>
    </div>
    <div class="global-chip">
      <div class="ring" id="globalRing" style="--pct:0"><span id="globalPct">0%</span></div>
      <div>
        <div class="label">Cumplimiento global</div>
        <div class="qual" id="globalQual">Sin datos</div>
      </div>
    </div>
  </div>
  <div class="meta-row">
    <div class="meta-field">
      <label>Fecha de auditoría</label>
      <input type="date" id="fecha">
    </div>
    <div class="meta-field">
      <label>Auditor</label>
      <input type="text" id="auditor" placeholder="Nombre del auditor">
    </div>
    <div class="meta-field">
      <label>Área / línea evaluada</label>
      <input type="text" id="area" placeholder="Ej. Corrugado, Bodega...">
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="tabset" id="tabs"></div>
  <div class="tabs-ring" id="tabsRing" style="--pct:0"><span id="tabsPct">0%</span></div>
</nav>

<main id="main"></main>

<footer class="bar">
  <div class="status" id="status">0 / 0 respondidas</div>
  <button class="btn-secondary" id="btnHistorial">Historial</button>
  <button class="btn-primary" id="btnGuardar">Guardar</button>
</footer>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close" id="closeSheet">Cerrar</button>
    <h3>Auditorías guardadas</h3>
    <p style="color:var(--text-soft);font-size:12.5px;margin-top:0;">Se guarda una auditoría por mes. Toca una fecha para cargarla.</p>
    <div id="histList"></div>
  </div>
</div>

<div class="toast" id="toast">Guardado</div>

<script type="module" src="app.js"></script>
</body>
</html>
