<head>

<style>
  :root{
    --navy:#0F2A4A;
    --navy-light:#1B3D63;
    --navy-soft:#EAF0F6;
    --gold:#C6A15B;
    --gold-dark:#A9843F;
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --line:#E3E0D7;
    --text:#1A1F26;
    --text-soft:#5B6270;
    --ok:#2F8F5B;
    --ok-bg:#E4F3EA;
    --bad:#C24444;
    --bad-bg:#FBEAEA;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html{
    margin:0;padding:0;height:auto;min-height:100%;
  }
  body{
    margin:0;padding:0;height:auto;min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    display:flex;flex-direction:column;
    overflow-y:auto;overflow-x:hidden;
  }

  .sesion-bar{
    flex-shrink:0;
    background:var(--navy-light);
    color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 18px;font-size:12.5px;
  }
  .sesion-bar a.volver{color:var(--gold);text-decoration:none;font-weight:700;}
  .sesion-bar a.volver:hover{text-decoration:underline;}
  .sesion-usuario{display:flex;align-items:center;gap:8px;}
  .sesion-avatar{
    width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;
  }
  .sesion-usuario button{
    border:none;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;
    padding:4px 12px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .sesion-usuario button:hover{background:rgba(255,255,255,.2);}

  .nav{
    flex-shrink:0;display:flex;align-items:center;gap:16px;
    padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);
  }
  .nav-brand{font-size:18px;font-weight:800;color:var(--navy);}
  .doc-code{font-size:12px;color:var(--text-soft);}
  .nav .spacer{flex:1;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .seg-opt{
    border:none;background:var(--surface);color:var(--text-soft);
    padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .seg-opt + .seg-opt{border-left:1px solid var(--line);}
  .seg-opt.active{background:var(--navy);color:#fff;}
  .seg-opt:disabled{opacity:.5;cursor:not-allowed;}

  .unidad-container{
    flex-shrink:0;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:8px 18px 10px;
  }
  .unidad-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
    gap:10px;
  }
  .unidad-title{
    font-size:13px;
    font-weight:800;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:6px;
    letter-spacing:-0.01em;
  }
  .unidad-title svg{width:16px;height:16px;color:var(--gold-dark);flex-shrink:0;}
  .unidad-grid-primario{
    display:grid;
    grid-template-columns:repeat(4, minmax(0, 1fr));
    gap:8px;
  }

  .ficha-campo{
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:5px 10px;
    display:flex;
    flex-direction:column;
    box-shadow:0 1px 2px rgba(0,0,0,0.03);
    transition:border-color 0.15s, box-shadow 0.15s;
  }
  .ficha-campo:focus-within{
    border-color:var(--navy);
    box-shadow:0 0 0 2px rgba(15,42,74,0.12);
  }
  .ficha-campo label{
    font-size:10.5px;
    font-weight:600;
    color:var(--text-soft);
    margin-bottom:2px;
  }
  .ficha-campo input{
    border:none;
    outline:none;
    padding:0;
    font-size:13px;
    font-weight:700;
    color:var(--text);
    background:transparent;
    font-family:inherit;
    width:100%;
  }
  .ficha-campo input::placeholder{
    font-weight:400;
    color:#a0a6b2;
  }
  .ficha-campo input:disabled{
    color:var(--text);
    cursor:default;
  }

  .ficha-campo--relativo{
    position:relative;
    z-index:25;
  }
  .badge-proveedor{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:10px;
    font-weight:700;
    padding:1px 7px;
    border-radius:999px;
    letter-spacing:0.02em;
    transition:all 0.2s ease;
  }
  .badge-proveedor--existente{
    background:#dcfce7;
    color:#15803d;
    border:1px solid #86efac;
  }
  .badge-proveedor--nuevo{
    background:#fef9c3;
    color:#854d0e;
    border:1px solid #fde047;
  }
  .sugerencias-dropdown{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 10px 25px rgba(15,23,42,0.18);
    max-height:220px;
    overflow-y:auto;
    z-index:1000;
  }
  .sugerencias-header{
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    color:var(--text-soft);
    background:#f8fafc;
    padding:6px 12px;
    border-bottom:1px solid var(--line);
    letter-spacing:0.03em;
  }
  .sugerencia-item{
    padding:8px 12px;
    font-size:12.5px;
    font-weight:600;
    color:var(--navy);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #f1f5f9;
    transition:background 0.12s;
  }
  .sugerencia-item:last-child{
    border-bottom:none;
  }
  .sugerencia-item:hover, .sugerencia-item--seleccionado{
    background:#f1f5f9;
    color:var(--navy-light);
  }
  .sugerencia-item--aviso{
    color:var(--text-soft);
    font-size:11.5px;
    cursor:default;
    background:#fafaf9;
    padding:10px 12px;
  }
  .sugerencia-icono{
    font-size:11px;
    color:var(--text-soft);
    opacity:0.6;
  }
  .mark-resaltado{
    background:#fef08a;
    color:#1e293b;
    font-weight:800;
    padding:0 1px;
    border-radius:2px;
  }
  .oculto{
    display:none !important;
  }

  #savedBanner{
    display:none;flex-shrink:0;background:var(--ok-bg);color:#245c37;
    padding:8px 20px;font-size:13px;font-weight:600;
  }

  .main-area{
    flex:1;
    display:block;
    width:100%;
    max-width:860px;
    margin:0 auto;
    padding:18px 16px 80px;
    overflow:visible;
  }
  .stage-wrap{display:none !important;}
  three-d-stage{display:none !important;}
  #hintOverlay{display:none !important;}

  .side-panel{
    width:100%;
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    background:var(--surface);
    box-shadow:0 4px 16px rgba(15,42,74,0.06);
    overflow:visible;
    height:auto;
    min-height:auto;
  }
  .panel-top{
    flex-shrink:0;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    background:#f8fafc;
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .panel-top__row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .panel-top__row span:first-child{font-weight:700;font-size:14px;color:var(--navy);}
  .panel-top__row span:last-child{font-size:13px;color:var(--text-soft);}
  .progress-track{height:8px;border-radius:999px;background:var(--line);overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;background:var(--ok);width:0;transition:width .2s ease;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;
    padding:10px 16px;
  }
  .btn-primary{background:var(--navy);color:#fff;width:100%;margin-top:10px;}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary:not(:disabled):hover{background:var(--navy-light);}
  .btn-ghost{background:transparent;color:var(--gold-dark);padding:4px 8px;font-size:12px;margin-bottom:8px;}
  .btn-ghost:hover{background:var(--navy-soft);}

  #panelBody{
    padding:16px 20px 28px;
    overflow:visible;
    height:auto;
    min-height:0;
  }
  .list-heading{font-size:12px;color:var(--text-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em;}
  .part-row{padding:10px 8px;border-radius:10px;display:flex;align-items:center;gap:10px;}
  .part-row--list{cursor:pointer;}
  .part-row--list:hover{background:var(--navy-soft);}
  .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .part-row__label{flex:1;font-size:13.5px;}
  .tag{display:inline-flex;align-items:center;font-size:10.5px;letter-spacing:.02em;padding:3px 10px;border-radius:999px;font-weight:700;}

  .detail-head{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .card-title{font-size:16px;font-weight:800;color:var(--navy);}

  /* Cada sección (Cabina, Paredes, Puertas…) dentro del listado único:
     antes esto solo se veía tras entrar al detalle de esa parte. */
  .part-section{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    padding:14px 16px 6px;
    margin-bottom:14px;
  }
  .part-section .detail-head{margin-bottom:10px;}
  .part-section .item-row:last-of-type{border-bottom:none;}

  .item-row{padding:10px 0;border-bottom:1px solid var(--line);}
  .item-row__label{font-size:13.5px;margin-bottom:6px;}
  .item-toggle .seg-opt{flex:1;}

  .dialog-backdrop{
    position:fixed;inset:0;background:rgba(15,20,26,.5);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:50;
  }
  .dialog{
    width:min(440px,100%);background:var(--surface);border-radius:16px;
    padding:20px;box-shadow:0 12px 32px rgba(15,20,26,.28);
  }
  .dialog-title{font-size:19px;font-weight:800;color:var(--navy);margin-bottom:8px;}
  .dialog-body{font-size:14px;color:var(--text);opacity:.9;margin-bottom:14px;}
  .dialog-actions{display:flex;justify-content:flex-end;gap:10px;}
  .dialog-actions .btn-ghost{margin:0;padding:8px 14px;}

  .panel-mode-switcher{
    width:100%;
    margin-bottom:12px;
    display:flex;
    background:#ffffff;
  }
  .panel-mode-switcher .seg-opt{
    flex:1;
    text-align:center;
    padding:9px 10px;
    font-size:12.5px;
  }
  .seg-opt--cumple.active{
    background:#16a34a !important;
    color:#ffffff !important;
    box-shadow:0 2px 5px rgba(22,163,74,0.3);
  }
  .seg-opt--nocumple.active{
    background:#dc2626 !important;
    color:#ffffff !important;
    box-shadow:0 2px 5px rgba(220,38,38,0.3);
  }
  .part-row{
    padding:11px 12px;
    min-height:50px;
    border:1px solid #e2e8f0;
    margin-bottom:7px;
    background:#ffffff;
    transition:all 0.15s ease;
  }
  .part-row:hover, .part-row:active{
    border-color:#cbd5e1;
    background:#f8fafc;
  }
  .part-row__subtitle{
    font-size:11px;
    color:var(--text-soft);
    margin-top:2px;
    display:block;
    line-height:1.3;
  }
  .btn-volver-lista{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    background:#f1f5f9;
    padding:8px 14px;
    border-radius:10px;
    border:1px solid #e2e8f0;
    margin-bottom:12px;
    cursor:pointer;
    width:100%;
    transition:background 0.15s;
    font-family:inherit;
  }
  .btn-volver-lista:hover{
    background:#e2e8f0;
  }

  /* ==========================================================================
     Adaptabilidad para Tablet y Móvil (100% amigable para tablet vertical)
     ========================================================================== */
  .btn-scroll-jump, .btn-scroll-top-3d {
    display: none !important;
  }

  @media (max-width: 860px) {
    .nav {
      padding: 8px 14px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .nav-brand {
      font-size: 16px;
    }
    .doc-code {
      display: none;
    }
    .unidad-container {
      padding: 8px 14px 10px;
    }
    .unidad-grid-primario {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .main-area {
      padding: 14px 12px 60px;
    }
    .panel-top {
      padding: 12px 14px;
    }
    #panelBody {
      padding: 12px 14px 20px;
    }
    .part-row {
      padding: 12px 12px;
      min-height: 52px;
    }
  }

  @media (max-width: 520px) {
    .unidad-grid-primario {
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .nav {
      justify-content: space-between;
    }
    .seg {
      width: 100%;
    }
    .seg-opt {
      flex: 1;
      text-align: center;
    }
  }
</style>
</head>
<body>

<div class="sesion-bar">
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="/hub/index.html" class="volver">← Hub</a>
    <span style="opacity:0.4;">|</span>
    <a href="/hub/verificacion-transporte/historial.html" class="volver">📋 Historial de Liberaciones</a>
  </div>
  <div class="sesion-usuario">
    <div class="sesion-avatar" id="avatarUsuario">—</div>
    <span id="nombreUsuario">—</span>
    <button type="button" id="btnSalir">Salir</button>
  </div>
</div>

<div class="nav">
  <div class="nav-brand">Liberación de Contenedores</div>
  <div class="doc-code">LOG-FO-101 · Rev. 02</div>
  <div class="spacer"></div>
  <div class="seg">
    <button class="seg-opt active" id="btnExterior" type="button">Vista Externa</button>
    <button class="seg-opt" id="btnInterior" type="button">Vista Interna</button>
  </div>
</div>

<div class="unidad-container">
  <div class="unidad-header">
    <div class="unidad-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Verificación de Unidad de Transporte
    </div>
    <div id="fechaHoy" style="font-size:12px; color:var(--text-soft); font-weight:600;"></div>
  </div>

  <!-- Únicos 4 campos solicitados: Empresa / Transporte, Piloto, Placa y TC -->
  <div class="unidad-grid-primario">
    <div class="ficha-campo ficha-campo--relativo">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
        <label for="campoTransporte" style="margin-bottom:0;">Empresa / Transporte *</label>
        <div id="badgeProveedor" class="badge-proveedor oculto"></div>
      </div>
      <input type="text" id="campoTransporte" placeholder="Buscar o ingresar proveedor…" autocomplete="off" required />
      <div id="listaSugerenciasTransporte" class="sugerencias-dropdown oculto" role="listbox"></div>
    </div>
    <div class="ficha-campo">
      <label for="campoPiloto">Nombre de Piloto *</label>
      <input type="text" id="campoPiloto" placeholder="Ej. Herber Hurtado" required />
    </div>
    <div class="ficha-campo">
      <label for="campoPlaca">Placa *</label>
      <input type="text" id="campoPlaca" placeholder="Ej. C-570BXS" required />
    </div>
    <div class="ficha-campo">
      <label for="campoTc">Tarjeta Circulación (TC) *</label>
      <input type="text" id="campoTc" placeholder="Ej. TC-24CSM" required />
    </div>
  </div>
</div>

<div id="savedBanner"></div>

<div class="main-area">
  <!-- Visor 3D comentado a solicitud (copia completa respaldada en copia-3d-respaldo/ e index-3d-backup.html)
  <div class="stage-wrap">
    <three-d-stage name="furgon" background="#f0eee6"></three-d-stage>
    <div id="hintOverlay">Toca una parte del contenedor o de la lista para inspeccionarla. Arrastra para rotar.</div>
  </div>
  -->

  <div class="side-panel">
    <div class="panel-top">
      <div class="panel-top__row"><span>Progreso</span><span id="progressCount">0/0</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
      <button class="btn btn-primary" id="btnFinalizar" type="button" disabled>Finalizar e Guardar Inspección</button>
    </div>
    <div id="panelBody"></div>
  </div>
</div>

<div class="dialog-backdrop" id="dialogBackdrop">
  <div class="dialog" id="dialogBody"></div>
</div>

<script type="module" src="app.js?v=20260910_03"></script>
</body>
</html>
