<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="/js/tema-horario.js"></script>
  <base href="/hub/sig-fo-118/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f38" />
  <title>Historial SIG-FO-118 · SGI</title>
  <link rel="stylesheet" href="/css/estilos.css" />
  <style>
    /* La cabecera de cada día es clickeable: abre o cierra sus callejones. */
    .tarjeta-dia__cabecera { cursor: pointer; border-radius: 10px; margin: -6px; padding: 6px; transition: background .12s; -webkit-tap-highlight-color: transparent; }
    .tarjeta-dia__cabecera:hover { background: var(--superficie-2, rgba(10,31,56,.04)); }
    .tarjeta-dia__cabecera:active { background: rgba(10,31,56,.08); }
    .tarjeta-dia__cabecera:focus-visible { outline: 2px solid var(--marino-700, #1d3d63); outline-offset: 2px; }
    .tarjeta-dia__cabecera .btn { pointer-events: none; }
  </style>
</head>
<body class="tema-hub">
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__marca">
        <a href="../index.html" class="app-header__logo" style="text-decoration: none; color: inherit;">PPR</a>
        <div class="app-header__titulos">
          <div class="titulo">Historial SIG-FO-118</div>
          <div class="subtitulo" id="texto-usuario">—</div>
        </div>
      </div>
      <div class="app-header__acciones">
        <span class="avatar avatar--claro avatar--sm" id="avatar-usuario" aria-hidden="true">—</span>
        <button id="btn-salir" class="btn btn-texto btn-sm" type="button">Salir</button>
      </div>
    </header>

    <main class="app-main app-main--ancho">
      <a href="../index.html" class="btn btn-secundario btn-sm btn-ancho-auto mb-2">← Volver al inicio</a>

      <div class="flex-entre mb-2">
        <p class="texto-suave texto-sm mb-0">Inspecciones de tarimas por día.</p>
        <a href="index.html" class="btn btn-dorado btn-sm btn-ancho-auto">+ Nuevo registro</a>
      </div>

      <div class="campos-fila mb-2">
        <div class="campo">
          <label for="filtro-periodo">Período</label>
          <input type="month" id="filtro-periodo" />
        </div>
        <div class="campo">
          <label for="filtro-busqueda">Buscar</label>
          <input type="search" id="filtro-busqueda" placeholder="Bodega, callejón, evaluador…" />
        </div>
      </div>

      <section class="tarjeta oculto" id="aviso-migracion"></section>
      <section class="tarjeta" id="resumen-periodo"></section>
      <div id="lista-registros" class="editor-lista"></div>
    </main>
  </div>

  <div id="modal-editar" class="modal-fondo oculto" role="dialog" aria-modal="true" aria-labelledby="modal-editar-titulo">
    <div class="modal-caja">
      <div class="modal-caja__cabecera">
        <h3 id="modal-editar-titulo" style="margin:0;">Editar callejón</h3>
        <button type="button" class="btn btn-icono btn-secundario" data-cerrar-modal aria-label="Cerrar">✕</button>
      </div>
      <form id="form-editar"></form>
    </div>
  </div>

  <script type="module" src="/hub/js/tarimas-historial.js"></script>
</body>
</html>
