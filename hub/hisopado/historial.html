<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="/js/tema-horario.js"></script>
  <base href="/hub/hisopado/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f38" />
  <title>Historial de Hisopado · SGI</title>
  <link rel="stylesheet" href="/css/estilos.css" />
</head>
<body class="tema-hub">
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__marca">
        <a href="../index.html" class="app-header__logo" style="text-decoration: none; color: inherit;">PPR</a>
        <div class="app-header__titulos">
          <div class="titulo">Historial de Hisopado</div>
          <div class="subtitulo" id="texto-usuario">—</div>
        </div>
      </div>
      <div class="app-header__acciones">
        <a href="resultados.html" class="btn btn-texto btn-sm">Resultados</a>
        <span class="avatar avatar--claro avatar--sm" id="avatar-usuario" aria-hidden="true">—</span>
        <button id="btn-salir" class="btn btn-texto btn-sm" type="button">Salir</button>
      </div>
    </header>

    <main class="app-main app-main--ancho">
      <a href="../index.html" class="btn btn-secundario btn-sm btn-ancho-auto mb-2">
        ← Volver al inicio
      </a>

      <div class="flex-entre mb-2">
        <p class="texto-suave texto-sm mb-0">Tomas de hisopado registradas.</p>
        <div class="flex-entre" style="gap: var(--e2);">
          <a href="index.html" class="btn btn-dorado btn-sm btn-ancho-auto">+ Nuevo registro</a>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" class="tabs__item activo" data-vista="tabla" role="tab">Tabla</button>
        <button type="button" class="tabs__item" data-vista="tarjetas" role="tab">Tarjetas</button>
      </div>

      <div class="campo mb-2" style="max-width: 160px;">
        <label for="campo-anio">Año</label>
        <select id="campo-anio"></select>
      </div>

      <section id="vista-tabla">
        <div class="flex-entre mb-2" style="flex-wrap: wrap; gap: var(--e3);">
          <div class="flex-entre leyenda-resultados" style="gap: var(--e3); font-size: var(--txt-xs); flex-wrap: wrap;">
            <span><span class="valor-resultado valor-resultado--conforme">RLU</span> Conforme</span>
            <span><span class="valor-resultado valor-resultado--fuera">RLU</span> Fuera del límite</span>
          </div>
          <button type="button" id="btn-descargar-tabla" class="btn btn-secundario btn-sm btn-ancho-auto" disabled>Descargar Excel</button>
        </div>
        <section id="zona-mensaje" class="tarjeta oculto"></section>
        <div id="zona-tabla" class="tabla-scroll">
          <table class="tabla-muestreo" id="tabla-resultados"></table>
        </div>
      </section>

      <section id="vista-tarjetas" class="oculto">
        <div class="campos-fila mb-2" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
          <div class="campo mb-0">
            <label for="filtro-resultado">Resultado</label>
            <select id="filtro-resultado">
              <option value="">Todos</option>
              <option value="conforme">Conforme</option>
              <option value="fuera">Fuera del límite</option>
            </select>
          </div>
          <div class="campo mb-0">
            <label for="filtro-dia">Día</label>
            <input type="date" id="filtro-dia" />
          </div>
          <div class="campo mb-0">
            <label for="filtro-turno">Turno</label>
            <select id="filtro-turno">
              <option value="">Todos</option>
              <option value="1">Turno 1</option>
              <option value="2">Turno 2</option>
              <option value="3">Turno 3</option>
            </select>
          </div>
        </div>
        <div class="flex-entre mb-2" style="flex-wrap: wrap; gap: var(--e2);">
          <p id="texto-filtros" class="texto-suave texto-xs mb-0"></p>
          <button type="button" id="btn-limpiar-filtros" class="btn btn-texto btn-sm oculto">Quitar filtros</button>
        </div>

        <div class="campo mb-2">
          <label for="filtro-busqueda">Buscar en lo cargado (superficie, área/máquina, supervisor o inspector)</label>
          <input type="search" id="filtro-busqueda" placeholder="Ej. Rodillos, Línea 3, Ana López…" />
        </div>

        <div id="lista-hisopados" class="editor-lista"></div>
        <div style="display: flex; justify-content: center; margin-top: var(--e3);">
          <button type="button" id="btn-mas-tarjetas" class="btn btn-secundario btn-sm btn-ancho-auto oculto">Cargar 10 más</button>
        </div>
        <p id="nota-busqueda" class="texto-suave texto-xs oculto" style="text-align:center; margin-top: var(--e2);">
          La búsqueda revisa solo lo ya cargado; pulsa “Cargar 10 más” para traer otros.
        </p>
      </section>
    </main>
  </div>

  <div id="modal-fondo" class="modal-fondo oculto">
    <div class="modal-caja">
      <div class="modal-caja__cabecera">
        <h3 id="modal-titulo" style="margin:0;">Editar registro</h3>
        <button type="button" id="btn-cerrar-modal" class="btn btn-icono btn-secundario">✕</button>
      </div>
      <form id="form-modal"></form>
    </div>
  </div>

  <script type="module" src="/hub/js/hisopado-historial.js"></script>
</body>
</html>
