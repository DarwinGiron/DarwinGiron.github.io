<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="/js/tema-horario.js"></script>
  <base href="/hub/hisopado/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f38" />
  <title>Registro de Hisopado · SGI</title>
  <link rel="stylesheet" href="/css/estilos.css" />
</head>
<body class="tema-hub">
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__marca">
        <a href="../index.html" class="app-header__logo" style="text-decoration: none; color: inherit;">PPR</a>
        <div class="app-header__titulos">
          <div class="titulo">Registro de Hisopado</div>
          <div class="subtitulo" id="texto-usuario">—</div>
        </div>
      </div>
      <div class="app-header__acciones">
        <a href="resultados.html" class="btn btn-texto btn-sm">Resultados</a>
        <a href="historial.html" class="btn btn-texto btn-sm">Historial</a>
        <span class="avatar avatar--claro avatar--sm" id="avatar-usuario" aria-hidden="true">—</span>
        <button id="btn-salir" class="btn btn-texto btn-sm" type="button">Salir</button>
      </div>
    </header>

    <main class="app-main">
      <a href="../index.html" class="btn btn-secundario btn-sm btn-ancho-auto mb-2">
        ← Volver al inicio
      </a>

      <section class="tarjeta">
        <div class="campos-fila mb-2">
          <div class="campo">
            <label for="campo-fecha">Fecha</label>
            <input type="date" id="campo-fecha" />
          </div>
          <div class="campo">
            <label for="campo-turno">Turno</label>
            <select id="campo-turno">
              <option value="1">Turno 1</option>
              <option value="2">Turno 2</option>
              <option value="3">Turno 3</option>
            </select>
          </div>
        </div>

        <div class="campo campo--autocompletar mb-2">
          <div class="campo__cabecera">
            <label for="campo-area-maquina">Área o máquina</label>
            <span id="badge-area-maquina" class="badge oculto"></span>
          </div>
          <input type="text" id="campo-area-maquina" autocomplete="off" placeholder="Ej. JS15, CORRUGACIÓN, BOTTOM PADS, LOGISTICA" />
          <div id="sugerencias-area-maquina" class="sugerencias-dropdown oculto" role="listbox"></div>
        </div>

        <div class="campos-fila mb-2">
          <div class="campo">
            <label for="campo-superficie">Superficie</label>
            <select id="campo-superficie"></select>
          </div>
          <div class="campo">
            <label for="campo-resultado">Resultado (RLU)</label>
            <input type="number" inputmode="decimal" id="campo-resultado" placeholder="Ej. 220" />
          </div>
        </div>

        <div class="campo campo--autocompletar mb-2">
          <div class="campo__cabecera">
            <label for="campo-supervisor">Supervisor</label>
            <span id="badge-supervisor" class="badge oculto"></span>
          </div>
          <input type="text" id="campo-supervisor" autocomplete="off" placeholder="Escribe el nombre del supervisor" />
          <div id="sugerencias-supervisor" class="sugerencias-dropdown oculto" role="listbox"></div>
        </div>

        <p class="texto-suave texto-sm mb-0" id="veredicto">Elige una superficie para ver su límite.</p>
      </section>

      <section class="tarjeta" id="tarjeta-observaciones">
        <div class="flex-entre mb-1">
          <h2 class="tarjeta__titulo mb-0">Observaciones</h2>
        </div>
        <p class="texto-suave texto-sm" id="ayuda-observaciones">
          Qué acciones inmediatas se realizaron y cualquier otra nota de la toma.
        </p>
        <div class="campo mb-0">
          <textarea
            id="campo-observaciones"
            rows="3"
            aria-label="Acciones inmediatas realizadas y observaciones"
            placeholder="Ej. Se mandó a lavar las manos al personal, se volvío a lavar el rodillo, etc..."
          ></textarea>
        </div>
      </section>

      <button type="button" id="btn-guardar" class="btn btn-dorado" style="margin-bottom: var(--e6, 24px);">
        Guardar registro
      </button>
    </main>
  </div>

  <script type="module" src="/hub/js/hisopado.js"></script>
</body>
</html>
