<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="/js/tema-horario.js"></script>
  <base href="/hub/hisopado/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f38" />
  <title>Tabla de Muestreo de Hisopados · SGI</title>
  <link rel="stylesheet" href="/css/estilos.css" />
</head>
<body class="tema-hub">
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__marca">
        <a href="../index.html" class="app-header__logo" style="text-decoration: none; color: inherit;">PPR</a>
        <div class="app-header__titulos">
          <div class="titulo">Tabla de Muestreo de Hisopados</div>
          <div class="subtitulo" id="texto-usuario">—</div>
        </div>
      </div>
      <div class="app-header__acciones">
        <span class="avatar avatar--claro avatar--sm" id="avatar-usuario" aria-hidden="true">—</span>
        <button id="btn-salir" class="btn btn-texto btn-sm" type="button">Salir</button>
      </div>
    </header>

    <main class="app-main app-main--ancho">
      <a href="../configuraciones.html" class="btn btn-secundario btn-sm btn-ancho-auto mb-2">
        ← Volver a Configuraciones
      </a>

      <section id="zona-semilla" class="oculto"></section>

      <div id="zona-editor" class="oculto">
        <div class="tabs">
          <button type="button" class="tabs__item activo" data-tab="limites">Límites y zonas</button>
          <button type="button" class="tabs__item" data-tab="tabla">Tabla anual</button>
        </div>

        <!-- LÍMITES Y ZONAS -->
        <section class="pestana activa" data-pestana="limites">
          <div class="flex-entre mb-2">
            <p class="texto-suave texto-sm mb-0">
              El rango límite se define por tipo de muestra y lo heredan todas sus zonas.
            </p>
            <button type="button" id="btn-nuevo-tipo" class="btn btn-dorado btn-sm btn-ancho-auto">
              + Tipo de muestra
            </button>
          </div>
          <div id="lista-tipos" class="editor-lista"></div>
        </section>

        <!-- TABLA ANUAL -->
        <section class="pestana" data-pestana="tabla">
          <div class="flex-entre mb-2">
            <p class="texto-suave texto-sm mb-0">
              Marca en qué meses toca muestrear cada zona. Es la cuadrícula del formato SIG-TA-102.
            </p>
            <button type="button" id="btn-descargar-tabla" class="btn btn-secundario btn-sm btn-ancho-auto">
              Descargar en Excel
            </button>
          </div>
          <div class="tabla-scroll">
            <table class="tabla-muestreo" id="tabla-muestreo"></table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="modal-fondo" class="modal-fondo oculto">
    <div class="modal-caja">
      <div class="modal-caja__cabecera">
        <h3 id="modal-titulo" style="margin:0;">Editar</h3>
        <button type="button" id="btn-cerrar-modal" class="btn btn-icono btn-secundario">✕</button>
      </div>
      <form id="form-modal"></form>
    </div>
  </div>

  <!-- SheetJS: mismo CDN y versión que ya usan los informes de Reportes. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="/hub/js/hisopado-admin.js"></script>
</body>
</html>
