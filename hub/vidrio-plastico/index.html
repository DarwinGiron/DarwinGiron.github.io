<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="/js/tema-horario.js"></script>
  <base href="/hub/vidrio-plastico/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f38" />
  <title>Vidrio y Plástico Quebradizo · SIG-FO-111</title>
  <link rel="stylesheet" href="/css/estilos.css" />
</head>
<body class="tema-hub">
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__marca">
        <a href="../index.html" class="app-header__logo" style="text-decoration: none; color: inherit;">PPR</a>
        <div class="app-header__titulos">
          <div class="titulo" id="titulo-formato">Vidrio y Plástico Quebradizo</div>
          <div class="subtitulo" id="texto-usuario">—</div>
        </div>
      </div>
      <div class="app-header__acciones">
        <a href="historial.html" class="btn btn-texto btn-sm">Historial</a>
        <span class="avatar avatar--claro avatar--sm" id="avatar-usuario" aria-hidden="true">—</span>
        <button id="btn-salir" class="btn btn-texto btn-sm" type="button">Salir</button>
      </div>
    </header>

    <main class="app-main app-main--ancho">
      <a href="../index.html" class="btn btn-secundario btn-sm btn-ancho-auto mb-2">
        ← Volver al inicio
      </a>

      <section class="tarjeta">
        <div class="flex-entre mb-1">
          <h2 class="tarjeta__titulo mb-0">Datos de la inspección</h2>
          <span class="badge badge-neutro" id="badge-codigo">SIG-FO-111</span>
        </div>
        <p class="texto-suave texto-sm" id="texto-frecuencia">A ser inspeccionado mensualmente</p>
        <div class="campo">
          <label for="campo-fecha">Fecha</label>
          <input type="date" id="campo-fecha" />
        </div>
        <div class="campo">
          <label for="campo-inspeccionado">Inspeccionado por</label>
          <input type="text" id="campo-inspeccionado" />
        </div>
        <div class="campo">
          <label for="campo-revisado">Revisado por (opcional)</label>
          <input type="text" id="campo-revisado" />
        </div>
      </section>

      <section class="tarjeta">
        <h2 class="tarjeta__titulo">Tipo de riesgo</h2>
        <ul class="lista-riesgos" id="lista-riesgos"></ul>
      </section>

      <section class="tarjeta">
        <div class="flex-entre mb-1">
          <h2 class="tarjeta__titulo mb-0">Puntos a inspeccionar</h2>
          <span class="badge badge-neutro" id="contador-avance">0 / 0</span>
        </div>
        <div class="campo">
          <label for="filtro-puntos">Buscar por proceso, localización o material</label>
          <input type="search" id="filtro-puntos" placeholder="Ej. Montacarga 22, espejo…" />
        </div>
        <label class="check-linea" style="margin-bottom: var(--e3);">
          <input type="checkbox" id="chk-pendientes" />
          Ver solo los que faltan
        </label>
        <div id="lista-puntos"></div>
      </section>

      <section class="tarjeta" id="tarjeta-comentarios">
        <h2 class="tarjeta__titulo">Comentarios de acción correctiva requerida</h2>
        <div class="campo">
          <label for="campo-comentarios">Comentarios generales</label>
          <textarea id="campo-comentarios" rows="4"></textarea>
        </div>
      </section>

      <button type="button" id="btn-guardar" class="btn btn-dorado" style="margin-bottom: var(--e6, 24px);">
        Guardar inspección
      </button>
    </main>
  </div>

  <template id="plantilla-punto">
    <div class="editor-item punto-item" style="margin-bottom: var(--e2);">
      <div class="flex-entre mb-1">
        <div style="min-width:0;">
          <strong class="texto-sm punto-material">—</strong>
          <div class="texto-suave texto-sm punto-ubicacion">—</div>
        </div>
        <span class="badge badge-neutro punto-tipo">—</span>
      </div>
      <div class="riesgo-opciones" role="group"></div>
      <div class="campo punto-accion oculto" style="margin-top: var(--e2);">
        <label>Acción requerida</label>
        <input type="text" data-campo="accion" placeholder="Qué se debe hacer con este punto" />
      </div>
    </div>
  </template>

  <script type="module" src="/hub/js/vidrio.js"></script>
</body>
</html>
