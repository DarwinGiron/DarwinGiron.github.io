  <style>
    /* Estilos de alto contraste para estados Aprobado (Verde) y Rechazado (Rojo) */
    .item-contenedor {
      transition: all 0.15s ease-in-out;
      border: 1px solid var(--borde);
      border-radius: var(--r-md);
      padding: var(--e3);
      margin-bottom: var(--e3);
      background: var(--superficie);
    }
    .item-contenedor.item-aprobado {
      border-left: 6px solid #16a34a !important;
      background: #fbfdfb;
    }
    .item-contenedor.item-aprobado:hover {
      background: #f0fdf4;
      border-color: #86efac;
    }
    .item-contenedor.item-rechazado {
      border-left: 6px solid #dc2626 !important;
      background: #fdfbfb;
    }
    .item-contenedor.item-rechazado:hover {
      background: #fef2f2;
      border-color: #fca5a5;
    }

    .badge-aprobado {
      background: #dcfce7 !important;
      color: #15803d !important;
      border: 1.5px solid #86efac !important;
      font-weight: 800 !important;
      font-size: 12.5px !important;
      padding: 4px 10px !important;
      border-radius: 999px !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 5px !important;
      letter-spacing: 0.02em;
    }
    .badge-rechazado {
      background: #fee2e2 !important;
      color: #b91c1c !important;
      border: 1.5px solid #fca5a5 !important;
      font-weight: 800 !important;
      font-size: 12.5px !important;
      padding: 4px 10px !important;
      border-radius: 999px !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 5px !important;
      letter-spacing: 0.02em;
    }

    .banner-aprobado {
      background: #ecfdf5;
      border: 2px solid #10b981;
      color: #065f46;
      padding: 14px 18px;
      border-radius: var(--r-md);
      margin-bottom: var(--e4);
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: var(--txt-md);
    }
    .banner-rechazado {
      background: #fef2f2;
      border: 2px solid #ef4444;
      color: #991b1b;
      padding: 14px 18px;
      border-radius: var(--r-md);
      margin-bottom: var(--e4);
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: var(--txt-md);
    }

    .grid-filtros-fechas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--e3);
      align-items: end;
      margin-top: var(--e3);
    }
  </style>
